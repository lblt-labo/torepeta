<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>トレペタ - for Figure Skating Coaches</title>
<style>
:root {
  --primary: #1e3a8a;
  --primary-light: #3b82f6;
  --primary-bg: #eff6ff;
  --surface: #ffffff;
  --bg: #f8fafc;
  --text: #0f172a;
  --text-sub: #475569;
  --border: #e2e8f0;
  --shadow-sm: 0 1px 2px 0 rgba(0,0,0,0.05);
  --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -1px rgba(0,0,0,0.06);
  --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.1), 0 4px 6px -2px rgba(0,0,0,0.05);
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-full: 9999px;
  
  --type-personal: #2563eb;
  --type-rental: #059669;
  --type-semi: #d97706;
  --type-kyoshitsu: #7c3aed;
  --type-choreography: #db2777;

  --status-unpaid: #ef4444;
  --status-paid: #10b981;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  background-color: var(--bg);
  color: var(--text);
  line-height: 1.5;
  user-select: none;
  -webkit-user-select: none;
  overflow: hidden;
  height: 100vh;
  width: 100vw;
}

.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
.tappable { cursor: pointer; transition: transform 0.1s ease, opacity 0.1s ease; }
.tappable:active { transform: scale(0.97); opacity: 0.8; }
.min-tap { min-height: 44px; min-width: 44px; }

#app-root {
  display: flex;
  flex-direction: column;
  height: 100vh;
  max-width: 600px;
  margin: 0 auto;
  background: var(--surface);
  position: relative;
  box-shadow: 0 0 20px rgba(0,0,0,0.05);
}

.app-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 16px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  z-index: 10;
}
.app-header__brand { display: flex; align-items: center; gap: 8px; }
.app-header__logo { font-size: 24px; }
.app-header__title { font-weight: 700; font-size: 18px; color: var(--primary); }
.app-header__subtitle { font-size: 10px; color: var(--text-sub); }
.app-header__right { display: flex; align-items: center; gap: 8px; }
.app-header__alert {
  background: #fef2f2;
  color: #dc2626;
  border: 1px solid #fecaca;
  font-size: 11px;
  padding: 4px 8px;
  border-radius: var(--radius-full);
  font-weight: 600;
}
.header-gear {
  background: none;
  border: none;
  font-size: 18px;
  padding: 4px;
  border-radius: var(--radius-sm);
}

.main-scroll {
  flex: 1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding-bottom: 80px;
}

.bottom-nav {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  height: 60px;
  background: var(--surface);
  border-top: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-around;
  z-index: 20;
}
.nav-btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  border: none;
  background: none;
  color: var(--text-sub);
  width: 50%;
  height: 100%;
  position: relative;
}
.nav-btn.is-active { color: var(--primary); font-weight: 600; }
.nav-btn__icon { font-size: 20px; }
.nav-btn__label { font-size: 11px; margin-top: 2px; }
.nav-btn__indicator {
  position: absolute;
  top: 0;
  width: 36px;
  height: 3px;
  background: transparent;
  border-radius: 0 0 4px 4px;
}
.nav-btn.is-active .nav-btn__indicator { background: var(--primary); }

.fab {
  position: absolute;
  bottom: 76px;
  right: 16px;
  width: 56px;
  height: 56px;
  border-radius: 28px;
  background: var(--primary);
  color: white;
  border: none;
  font-size: 28px;
  box-shadow: var(--shadow-lg);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 15;
}

.view-switcher {
  display: flex;
  background: var(--bg);
  padding: 4px;
  border-radius: var(--radius-md);
  margin: 12px 16px 8px;
}
.view-btn {
  flex: 1;
  border: none;
  background: none;
  padding: 6px;
  font-size: 13px;
  border-radius: var(--radius-sm);
  color: var(--text-sub);
  font-weight: 500;
}
.view-btn.is-active {
  background: var(--surface);
  color: var(--text);
  font-weight: 600;
  box-shadow: var(--shadow-sm);
}

.date-strip {
  display: flex;
  overflow-x: auto;
  padding: 4px 12px 12px;
  gap: 8px;
  scroll-behavior: smooth;
}
.date-strip::-webkit-scrollbar { display: none; }
.date-chip {
  flex: 0 0 auto;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  width: 52px;
  height: 64px;
  border-radius: var(--radius-md);
  border: 1px solid var(--border);
  background: var(--surface);
}
.date-chip.is-selected {
  background: var(--primary);
  color: white;
  border-color: var(--primary);
}
.date-chip__day { font-size: 11px; opacity: 0.8; }
.date-chip__num { font-size: 18px; font-weight: 700; margin-top: 2px; }
.date-chip__dots { display: flex; gap: 2px; margin-top: 4px; height: 4px; }
.date-chip__dot { width: 4px; height: 4px; border-radius: 50%; background: var(--text-sub); }
.date-chip.is-selected .date-chip__dot { background: white; }

.calendar-view { padding: 0 16px 16px; }
.calendar-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.calendar-header__title { font-size: 16px; font-weight: 700; }
.calendar-nav-btn { background: none; border: none; font-size: 18px; padding: 4px 8px; }
.calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; }
.calendar-day-head { font-size: 11px; color: var(--text-sub); padding: 4px 0; }
.calendar-cell {
  aspect-ratio: 1;
  border-radius: var(--radius-sm);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  padding: 4px 2px;
  font-size: 12px;
  border: 1px solid transparent;
  background: var(--bg);
}
.calendar-cell.is-other-month { opacity: 0.3; }
.calendar-cell.is-selected { border-color: var(--primary); background: var(--primary-bg); font-weight: 700; }
.calendar-cell.is-today .calendar-cell__num { color: var(--primary-light); font-weight: 700; }
.calendar-cell__dots { display: flex; flex-wrap: wrap; gap: 2px; justify-content: center; margin-top: 2px; }
.calendar-cell__dot { width: 5px; height: 5px; border-radius: 50%; }

.section-title { font-size: 14px; font-weight: 700; color: var(--text-sub); padding: 8px 16px 4px; }
.lesson-list { padding: 0 16px; display: flex; flex-direction: column; gap: 10px; }
.lesson-empty { text-align: center; padding: 32px 16px; color: var(--text-sub); font-size: 14px; }

.lesson-card {
  background: var(--surface);
  border-radius: var(--radius-md);
  border: 1px solid var(--border);
  padding: 12px;
  box-shadow: var(--shadow-sm);
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.lesson-card__head { display: flex; align-items: center; justify-content: space-between; }
.lesson-card__time { font-size: 13px; font-weight: 600; color: var(--text-sub); }
.lesson-card__body { display: flex; align-items: flex-start; gap: 10px; }
.lesson-card__info { flex: 1; }
.lesson-card__name { font-size: 16px; font-weight: 700; color: var(--text); }
.lesson-card__meta { font-size: 12px; color: var(--text-sub); margin-top: 2px; display: flex; gap: 8px; flex-wrap: wrap; }
.lesson-card__level { display: flex; gap: 4px; margin-top: 4px; flex-wrap: wrap; }
.level-badge { font-size: 10px; background: #f1f5f9; padding: 2px 6px; border-radius: 4px; border: 1px solid #cbd5e1; color: #475569; }

.lesson-card__foot {
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-top: 1px dashed var(--border);
  padding-top: 8px;
  margin-top: 4px;
}
.lesson-card__fee { font-size: 14px; font-weight: 700; }
.lesson-card__actions { display: flex; gap: 6px; }
.btn-action {
  font-size: 11px;
  padding: 4px 8px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  background: var(--bg);
  display: flex;
  align-items: center;
  gap: 4px;
}
.btn-action--done { background: #ecfdf5; color: #047857; border-color: #a7f3d0; }

.type-badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  font-weight: 700;
  padding: 2px 8px;
  color: white;
  border-radius: var(--radius-full);
}
.type-badge--sm { font-size: 10px; padding: 1px 6px; }
.type-badge--md { font-size: 12px; padding: 4px 10px; }

.badge-shape-pill { border-radius: var(--radius-full); }
.badge-shape-rect { border-radius: 4px; }
.badge-shape-hexagon { clip-path: polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%); padding: 2px 10px; }
.badge-shape-circle { border-radius: 50%; width: 24px; height: 24px; padding: 0; }

.type-personal { background-color: var(--type-personal); }
.type-rental { background-color: var(--type-rental); }
.type-semi { background-color: var(--type-semi); }
.type-kyoshitsu { background-color: var(--type-kyoshitsu); }
.type-choreography { background-color: var(--type-choreography); }

.finance-view { padding: 16px; display: flex; flex-direction: column; gap: 16px; }
.finance-year { display: flex; align-items: center; justify-content: space-between; }
.year-nav { display: flex; align-items: center; gap: 12px; }
.year-nav__btn { background: none; border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 4px 12px; font-size: 16px; }
.year-nav__label { font-size: 18px; font-weight: 700; }
.btn-csv {
  background: #f0fdf4;
  color: #15803d;
  border: 1px solid #bbf7d0;
  padding: 6px 12px;
  border-radius: var(--radius-sm);
  font-size: 12px;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 4px;
}

.summary-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.summary-card {
  padding: 12px;
  border-radius: var(--radius-md);
  border: 1px solid var(--border);
  background: var(--surface);
}
.summary-card--paid { border-left: 4px solid var(--status-paid); }
.summary-card--unpaid { border-left: 4px solid var(--status-unpaid); }
.summary-card__label { font-size: 11px; color: var(--text-sub); }
.summary-card__value { font-size: 18px; font-weight: 700; margin-top: 2px; }
.summary-card__count { font-size: 11px; color: var(--text-sub); margin-top: 2px; }

.list-title { font-size: 14px; font-weight: 700; margin-bottom: 8px; color: var(--text-sub); }
.unpaid-list { display: flex; flex-direction: column; gap: 8px; }
.unpaid-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 12px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  text-align: left;
  width: 100%;
}
.unpaid-row__body { flex: 1; margin: 0 8px; }
.unpaid-row__name { font-size: 14px; font-weight: 600; }
.unpaid-row__date { font-size: 11px; color: var(--text-sub); }
.unpaid-row__right { text-align: right; }
.unpaid-row__fee { font-size: 14px; font-weight: 700; color: var(--status-unpaid); }
.unpaid-row__cta { font-size: 10px; color: var(--primary-light); }

.breakdown-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.breakdown-row { display: flex; align-items: center; font-size: 13px; }
.breakdown-row__icon { margin-right: 8px; width: 20px; height: 20px; font-size: 10px; }
.breakdown-row__label { flex: 1; }
.breakdown-row__count { color: var(--text-sub); margin-right: 12px; font-size: 12px; }
.breakdown-row__sum { font-weight: 700; }

.sheet-overlay {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.4);
  z-index: 100;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  animation: fadeIn 0.2s ease;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

.sheet-backdrop { flex: 1; }
.sheet {
  background: var(--surface);
  border-radius: var(--radius-lg) var(--radius-lg) 0 0;
  max-height: 90vh;
  display: flex;
  flex-direction: column;
  animation: slideUp 0.2s ease;
}
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

.sheet__grabber-row { display: flex; justify-content: center; padding: 8px; }
.sheet__grabber { width: 36px; height: 4px; background: var(--border); border-radius: 2px; }
.sheet__header {
  padding: 0 16px 12px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 10px;
}
.sheet__header-text { flex: 1; }
.sheet__header-title { font-size: 16px; font-weight: 700; }
.sheet__header-sub { font-size: 12px; color: var(--text-sub); }
.sheet__close { background: none; border: none; font-size: 20px; color: var(--text-sub); padding: 4px; }

.sheet__body { padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; }
.sheet__footer { padding: 12px 16px; border-top: 1px solid var(--border); background: var(--surface); }
.sheet__submit {
  width: 100%;
  padding: 12px;
  background: var(--primary);
  color: white;
  border: none;
  border-radius: var(--radius-md);
  font-size: 15px;
  font-weight: 600;
}
.sheet__submit:disabled { opacity: 0.5; }

.field-label { font-size: 12px; font-weight: 600; color: var(--text-sub); margin-bottom: 6px; }
.text-input, .select-input, .date-input {
  width: 100%;
  padding: 10px 12px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  font-size: 14px;
  background: var(--bg);
}
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }

.type-select-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.type-select-btn {
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 8px 4px;
  background: var(--bg);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
}
.type-select-btn.is-selected { border-color: var(--primary); background: var(--primary-bg); }

.rink-row { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; }
.rink-btn {
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 6px 12px;
  font-size: 12px;
  white-space: nowrap;
  background: var(--bg);
}
.rink-btn.is-selected { background: var(--primary); color: white; border-color: var(--primary); }

.money-box { background: var(--bg); padding: 12px; border-radius: var(--radius-sm); border: 1px solid var(--border); }
.money-row { display: flex; align-items: center; justify-content: space-between; }
.money-row + .money-row { margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--border); }
.fee-input { width: 100px; text-align: right; padding: 4px 8px; border: 1px solid var(--border); border-radius: 4px; font-size: 16px; font-weight: 700; }
.stepper { display: flex; align-items: center; border: 1px solid var(--border); border-radius: 4px; background: white; }
.stepper__btn { width: 28px; height: 28px; border: none; background: none; font-size: 16px; font-weight: 700; }
.split-input { width: 36px; text-align: center; border: none; font-size: 14px; font-weight: 700; }
.per-person-note { font-size: 11px; color: var(--text-sub); text-align: right; margin-top: 4px; }

.advice-box { background: #fffbebf; border: 1px solid #fef3c7; border-radius: var(--radius-sm); padding: 10px 12px; }
.advice-box__title { font-size: 11px; font-weight: 700; color: #b45309; display: flex; align-items: center; gap: 4px; }
.advice-box__text { font-size: 13px; color: #78350f; margin-top: 2px; }

.action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.action-btn {
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 10px;
  background: var(--bg);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  font-size: 12px;
  font-weight: 600;
}
.action-btn--line { background: #06c755; color: white; border-color: #06c755; }
.action-btn--pay.is-done { background: #ecfdf5; color: #047857; border-color: #a7f3d0; }

.tag-wrap { display: flex; flex-wrap: wrap; gap: 6px; }
.tag-chip {
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  padding: 4px 10px;
  font-size: 11px;
  background: var(--bg);
  color: var(--text-sub);
}
.tag-chip.is-selected { background: #e0e7ff; color: #3730a3; border-color: #c7d2fe; font-weight: 600; }

.notes-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
.mic-btn { background: none; border: 1px solid var(--border); border-radius: 50%; width: 28px; height: 28px; font-size: 14px; display: flex; align-items: center; justify-content: center; }
.mic-btn.is-recording { background: #fee2e2; border-color: #fca5a5; animation: pulse 1s infinite; }
@keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
.recording-hint { font-size: 10px; color: #dc2626; margin-bottom: 4px; }
.notes-textarea { width: 100%; height: 60px; padding: 8px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 13px; background: var(--bg); resize: none; }

.delete-link { color: #dc2626; font-size: 12px; text-align: center; border: none; background: none; padding: 8px; margin-top: 8px; width: 100%; }

.toast {
  position: fixed;
  top: 20px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(15, 23, 42, 0.9);
  color: white;
  padding: 8px 16px;
  border-radius: var(--radius-full);
  font-size: 13px;
  font-weight: 500;
  z-index: 200;
  box-shadow: var(--shadow-lg);
  pointer-events: none;
  animation: toastIn 0.2s ease;
}
.toast--ok { background: rgba(16, 185, 129, 0.95); }
.toast--danger { background: rgba(239, 68, 68, 0.95); }
.toast--navy { background: rgba(30, 58, 138, 0.95); }
@keyframes toastIn { from { opacity: 0; transform: translate(-50%, -10px); } to { opacity: 1; transform: translate(-50%, 0); } }

.classroom-list { display: flex; flex-direction: column; gap: 8px; }
.classroom-row { display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--bg); }
.classroom-row__name { font-weight: 600; font-size: 13px; }
.classroom-row__meta { font-size: 11px; color: var(--text-sub); }
.classroom-row__actions { display: flex; gap: 4px; }
.icon-btn { background: none; border: none; font-size: 14px; padding: 4px; }
.icon-btn--danger { color: #dc2626; }
.classroom-empty { text-align: center; color: var(--text-sub); font-size: 12px; padding: 12px; }
.classroom-form-title { font-size: 13px; font-weight: 700; margin-top: 12px; display: flex; justify-content: space-between; align-items: center; }
.classroom-cancel-edit { font-size: 11px; color: var(--primary-light); font-weight: normal; }
.classroom-manage-link { background: none; border: none; color: var(--primary-light); font-size: 11px; text-decoration: underline; margin-top: 4px; padding: 0; text-align: left; }

.lock-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; padding: 32px; text-align: center; background: var(--surface); }
.lock-screen__icon { font-size: 48px; margin-bottom: 16px; }
.lock-screen__title { font-size: 20px; font-weight: 700; margin-bottom: 8px; }
.lock-screen__sub { font-size: 13px; color: var(--text-sub); margin-bottom: 24px; }
.lock-screen__input { text-align: center; font-size: 24px; letter-spacing: 8px; width: 180px; padding: 8px; border: 1px solid var(--border); border-radius: var(--radius-md); margin-bottom: 16px; }
.lock-screen__btn { width: 180px; padding: 12px; background: var(--primary); color: white; border: none; border-radius: var(--radius-md); font-weight: 600; }
</style>
</head>
<body>

<div id="app-root"></div>
<div id="overlay-root"></div>
<div id="classroom-overlay-root"></div>
<div id="toast-root"></div>

<script>
(function(){
  'use strict';

  var LESSON_TYPES = {
    personal:    { label:'個人レッスン', short:'個人', icon:'👤', cls:'type-personal', shape:'badge-shape-pill' },
    rental:      { label:'貸切',         short:'貸切', icon:'⛸️', cls:'type-rental', shape:'badge-shape-rect' },

  function esc(str){

  function showToast(msg, type){

    setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); }, 2400);

  function copyToClipboard(text){
    if(navigator.clipboard && navigator.clipboard.writeText){
      return navigator.clipboard.writeText(text).then(function(){ return true; }).catch(function(){ return false; });
    }
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    var ok = false;
    try { ok = document.execCommand('copy'); } catch(e){}
    document.body.removeChild(ta);
    return Promise.resolve(ok);
  }

  function fmtDateJp(dateStr){
    var parts = dateStr.split('-');
    if(parts.length!==3) return dateStr;
    var d = new Date(Number(parts[0]), Number(parts[1])-1, Number(parts[2]));
    var days = ['日','月','火','水','木','金','土'];
    return Number(parts[1]) + '月' + Number(parts[2]) + '日(' + days[d.getDay()] + ')';
  }

  function renderDateStrip(){
    var cur = new Date(selectedDate + 'T00:00:00');
    var days = [];
    for(var i=-14; i<=14; i++){
      var d = new Date(cur);
      d.setDate(d.getDate() + i);
      var y = d.getFullYear();
      var m = String(d.getMonth()+1).padStart(2,'0');
      var day = String(d.getDate()).padStart(2,'0');
      var key = y + '-' + m + '-' + day;
      var w = ['日','月','火','水','木','金','土'][d.getDay()];
      days.push({ key:key, num:d.getDate(), week:w, isToday: key===todayStr() });
    }
    var html = '<div class="date-strip" id="date-strip">';
    days.forEach(function(d){
      var sel = d.key === selectedDate ? ' is-selected' : '';
      var count = lessons.filter(function(l){ return l.date===d.key; }).length;
      html += '<button class="date-chip tappable' + sel + '" data-action="select-date" data-date="' + d.key + '">';
      html += '<span class="date-chip__day">' + d.week + '</span>';
      html += '<span class="date-chip__num mono">' + d.num + '</span>';
      html += '<div class="date-chip__dots">';
      for(var k=0; k<Math.min(count,3); k++){ html += '<span class="date-chip__dot"></span>'; }
      html += '</div></button>';
    });
    html += '</div>';
    return html;
  }

  function renderCalendarMonth(){
    var firstDay = new Date(calYear, calMonth, 1);

    startDate.setDate(startDate.getDate() - startWeek);

    var html = '<div class="calendar-view">';

    html += '<button class="calendar-nav-btn tappable" data-action="cal-prev-month">‹</button>';

    html += '<button class="calendar-nav-btn tappable" data-action="cal-next-month">›</button>';
    html += '</div>';
    html += '<div class="calendar-grid">';
    var weeks = ['日','月','火','水','木','金','土'];
    weeks.forEach(function(w){ html += '<div class="calendar-day-head">' + w + '</div>'; });

    var curr = new Date(startDate);
    for(var cell=0; cell<35; cell++){
      var y = curr.getFullYear();
      var m = String(curr.getMonth()+1).padStart(2,'0');
      var day = String(curr.getDate()).padStart(2,'0');
      var key = y + '-' + m + '-' + day;

      html += '<button class="' + cls + '" data-action="select-date" data-date="' + key + '">';
      html += '<span class="calendar-cell__num mono">' + curr.getDate() + '</span>';

    }
    html += '</div></div>';
    return html;

  function exportCsv(){
    var rows = lessons.filter(function(l){ return l.date.indexOf(String(financeYear))===0; });
    if(rows.length === 0){ showToast(financeYear + '年のデータがありません', 'danger'); return; }
    var header = ['日付','開始','終了','種別','生徒名/グループ名','バッジテスト','ISI','区分','リンク','料金','割り勘人数','入金状況','連絡状況','カルテタグ'];
    rows = rows.slice().sort(function(a,b){ return a.date.localeCompare(b.date) || a.start.localeCompare(b.start); });
    var lines = rows.map(function(l){
      var lvl = l.level || {};
      return [ l.date, l.start, l.end, LESSON_TYPES[l.type].label, l.student, lvl.jsf||'', lvl.isi||'', lvl.category||'', l.rink, l.fee, l.splitCount||1, l.paymentStatus, l.contactStatus, (l.tags||[]).join('/') ];
    });
    var totalAll = rows.reduce(function(s,l){ return s+Number(l.fee||0); },0);
    var totalPaid = rows.filter(function(l){ return l.paymentStatus==='回収済'; }).reduce(function(s,l){ return s+Number(l.fee||0); },0);
    lines.push([]);
    lines.push(['', '', '', '', '', '', '', '', '年間合計', totalAll, '', '回収済合計:' + totalPaid, '', '']);
    function escCsv(v){
      var s = String(v==null ? '' : v);
      return /[",\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s;
    }
    var csv = [header].concat(lines).map(function(row){ return row.map(escCsv).join(','); }).join('\r\n');
    var blob = new Blob(['\uFEFF' + csv], { type:'text/csv;charset=utf-8;' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'トレペタ_確定申告用_' + financeYear + '年.csv';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast(financeYear + '年分のCSVを出力しました', 'ok');
  }

  function createRecognizer(onFinalText){
    var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if(!SR) return null;
    var rec = new SR();
    rec.lang = 'ja-JP';
    rec.continuous = true;
    rec.interimResults = true;
    rec.onresult = function(e){
      var finalTxt = '';
      for(var i=e.resultIndex; i<e.results.length; i++){
        if(e.results[i].isFinal) finalTxt += e.results[i][0].transcript;
      }
      if(finalTxt) onFinalText(finalTxt);
    };
    return rec;
  }

  function findPrevAdvice(lesson){
    var candidates = lessons.filter(function(l){
      return l.student === lesson.student && l.id !== lesson.id && (l.homework || l.notes) &&
        (l.date + 'T' + (l.start||'00:00')) < (lesson.date + 'T' + (lesson.start||'00:00'));
    });
    candidates.sort(function(a,b){ return (b.date+'T'+b.start).localeCompare(a.date+'T'+a.start); });
    return candidates[0] || null;
  }

  function attachLessonModalListeners(lesson){
    var overlay = document.getElementById('lesson-overlay');
    overlay.addEventListener('click', function(e){
      var actionEl = e.target.closest('[data-action]');
      if(actionEl && actionEl.dataset.action === 'close-sheet' && (actionEl === e.target || actionEl.classList.contains('sheet-backdrop'))){
        closeModal();
      }
    });
    var feeInput = document.getElementById('fee-input');
    var splitInput = document.getElementById('split-input');
    var perPersonNote = document.getElementById('per-person-note');
    function recalcPerPerson(){
      if(!splitInput) return;
      var fee = Number(feeInput.value) || 0;
      var split = Math.max(1, Number(splitInput.value) || 1);
      if(split > 1){
        perPersonNote.style.display = '';
        perPersonNote.textContent = 'お一人あたり ' + yen(Math.ceil(fee/split));
      } else {
        perPersonNote.style.display = 'none';
      }
    }
    if(feeInput) feeInput.addEventListener('input', recalcPerPerson);
    if(splitInput){
      splitInput.addEventListener('input', recalcPerPerson);
      document.getElementById('split-minus').addEventListener('click', function(){
        splitInput.value = Math.max(1, (Number(splitInput.value)||1) - 1);
        recalcPerPerson();
      });
      document.getElementById('split-plus').addEventListener('click', function(){
        splitInput.value = (Number(splitInput.value)||1) + 1;
        recalcPerPerson();
      });
    }
    var tagWrap = document.getElementById('tag-wrap');
    tagWrap.addEventListener('click', function(e){
      var chip = e.target.closest('.tag-chip');
      if(!chip) return;
      chip.classList.toggle('is-selected');
    });
    function currentTags(){
      return Array.prototype.slice.call(tagWrap.querySelectorAll('.tag-chip.is-selected')).map(function(el){ return el.dataset.tag; });
    }
    function currentFee(){ return Number(feeInput.value) || 0; }
    function currentSplit(){ return splitInput ? Math.max(1, Number(splitInput.value)||1) : 1; }

    document.getElementById('btn-line').addEventListener('click', function(){
      lesson.fee = currentFee();
      lesson.splitCount = currentSplit();
      var msg = buildLineMessage(lesson);
      copyToClipboard(msg).then(function(ok){
        if(ok){
          lesson.contactStatus = '連絡済';
          persist();
          renderShell();
          var btn = document.getElementById('btn-line');
          btn.classList.add('is-done');
          btn.innerHTML = '<span class="action-btn__icon">💬</span><span>連絡済（再コピー）</span>';
          showToast('LINE文をコピーしました📋', 'ok');
        } else {
          showToast('コピーに失敗しました', 'danger');
        }
      });
    });

    document.getElementById('btn-pay').addEventListener('click', function(){
      lesson.paymentStatus = lesson.paymentStatus === '回収済' ? '未回収' : '回収済';
      persist();
      renderShell();
      var btn = document.getElementById('btn-pay');
      var isDone = lesson.paymentStatus === '回収済';
      btn.classList.toggle('is-done', isDone);
      btn.innerHTML = '<span class="action-btn__icon">' + (isDone?'✅':'💴') + '</span><span>' + (isDone?'回収済み':'未回収 → タップで回収') + '</span>';
      showToast(isDone ? '入金済みにしました' : '未回収に戻しました', 'navy');
    });

    var micBtn = document.getElementById('mic-btn');
    var recordingHint = document.getElementById('recording-hint');
    var notesTextarea = document.getElementById('notes-textarea');
    var recognizing = false;
    var recognizer = createRecognizer(function(text){
      notesTextarea.value = (notesTextarea.value ? notesTextarea.value + ' ' : '') + text;
    });

    if(!recognizer){
      micBtn.outerHTML = '<span class="mic-unsupported">🎤 音声入力非対応</span>';
    } else {
      recognizer.onend = function(){ recognizing = false; micBtn.classList.remove('is-recording'); recordingHint.style.display = 'none'; };
      recognizer.onerror = function(){ recognizing = false; micBtn.classList.remove('is-recording'); recordingHint.style.display = 'none'; };
      micBtn.addEventListener('click', function(){
        if(recognizing){
          recognizer.stop();
          recognizing = false;
          micBtn.classList.remove('is-recording');
          recordingHint.style.display = 'none';
        } else {
          try{
            recognizer.start();
            recognizing = true;
            micBtn.classList.add('is-recording');
            recordingHint.style.display = '';
          }catch(e){ }
        }
      });
    }

    document.getElementById('btn-delete').addEventListener('click', function(){
      if(window.confirm('この予定を削除しますか？')){
        lessons = lessons.filter(function(l){ return l.id !== lesson.id; });
        persist();
        closeModal();
        renderShell();
        showToast('予定を削除しました', 'navy');
      }
    });

    document.getElementById('btn-save-lesson').addEventListener('click', function(){
      lesson.fee = currentFee();
      lesson.splitCount = currentSplit();
      lesson.tags = currentTags();
      lesson.notes = notesTextarea.value;
      lesson.homework = document.getElementById('homework-textarea').value;
      lesson.level = {
        jsf: document.getElementById('edit-lvl-jsf').value,
        isi: document.getElementById('edit-lvl-isi').value,
        category: document.getElementById('edit-lvl-cat').value
      };
      persist();
      renderShell();
      closeModal();
      showToast('カルテを保存しました', 'ok');
    });
  }

  function attachAddSheetListeners(){
    var overlay = document.getElementById('add-overlay');
    var selectedType = 'personal';
    overlay.addEventListener('click', function(e){
      var actionEl = e.target.closest('[data-action]');
      if(!actionEl) return;
      if(actionEl.dataset.action === 'close-sheet'){ closeModal(); }
      else if(actionEl.dataset.action === 'open-classroom-master'){ openClassroomMasterModal(); }
    });
    var typeGrid = document.getElementById('type-select-grid');
    var splitRow = document.getElementById('add-split-row');
    var classroomBlock = document.getElementById('classroom-select-block');
    var studentLabel = document.getElementById('add-student-label');
    var studentInputEl = document.getElementById('add-student');
    var allSelCls = TYPE_ORDER.map(function(k){ return 'sel-' + k; });

    typeGrid.addEventListener('click', function(e){
      var btn = e.target.closest('.type-select-btn');
      if(!btn) return;
      Array.prototype.forEach.call(typeGrid.querySelectorAll('.type-select-btn'), function(el){
        el.classList.remove.apply(el.classList, ['is-selected'].concat(allSelCls));
      });
      btn.classList.add('is-selected', btn.dataset.selcls);
      selectedType = btn.dataset.type;
      splitRow.style.display = (selectedType === 'rental') ? '' : 'none';
      if(selectedType === 'kyoshitsu'){
        classroomBlock.style.display = '';
        studentLabel.textContent = '教室名 / レッスン内容';
        studentInputEl.placeholder = '例：〇〇スケート教室 / 大人クラス初級';
      } else {
        classroomBlock.style.display = 'none';
        studentLabel.textContent = '生徒名 / グループ名';
        studentInputEl.placeholder = '例：佐藤 ひなた';
      }
    });

    var rinkRow = document.getElementById('rink-row');
    rinkRow.addEventListener('click', function(e){
      var btn = e.target.closest('.rink-btn');
      if(!btn) return;
      Array.prototype.forEach.call(rinkRow.querySelectorAll('.rink-btn'), function(el){ el.classList.remove('is-selected'); });
      btn.classList.add('is-selected');
    });

    var classroomSelect = document.getElementById('add-classroom-select');
    classroomSelect.addEventListener('change', function(){
      var val = classroomSelect.value;
      if(!val) return;
      var c = classroomMaster.find(function(x){ return x.id === val; });
      if(!c) return;
      studentInputEl.value = c.name;
      document.getElementById('add-start').value = c.start;
      document.getElementById('add-end').value = c.end;
      Array.prototype.forEach.call(rinkRow.querySelectorAll('.rink-btn'), function(el){
        el.classList.toggle('is-selected', el.dataset.rink === c.rink);
      });
      submitBtnRef.disabled = studentInputEl.value.trim().length === 0;
    });

    var addSplit = document.getElementById('add-split');
    document.getElementById('add-split-minus').addEventListener('click', function(){ addSplit.value = Math.max(1,(Number(addSplit.value)||1)-1); });
    document.getElementById('add-split-plus').addEventListener('click', function(){ addSplit.value = (Number(addSplit.value)||1)+1; });

    var studentInput = document.getElementById('add-student');
    var submitBtnRef = document.getElementById('btn-create-lesson');
    var submitBtn = submitBtnRef;
    studentInput.addEventListener('input', function(){ submitBtn.disabled = studentInput.value.trim().length === 0; });

    submitBtn.addEventListener('click', function(){
      if(studentInput.value.trim().length === 0) return;
      var rinkBtn = rinkRow.querySelector('.rink-btn.is-selected');
      var newLesson = {
        id: uid(),
        date: document.getElementById('add-date').value || todayStr(),
        start: document.getElementById('add-start').value || '09:00',
        end: document.getElementById('add-end').value || '09:30',
        type: selectedType,
        student: studentInput.value.trim(),
        rink: rinkBtn ? rinkBtn.dataset.rink : RINKS[0],
        fee: Number(document.getElementById('add-fee').value) || 0,
        splitCount: Math.max(1, Number(addSplit.value)||1),
        contactStatus: '未連絡',
        paymentStatus: '未回収',
        tags: [],
        level: {
          jsf: document.getElementById('add-lvl-jsf').value,
          isi: document.getElementById('add-lvl-isi').value,
          category: document.getElementById('add-lvl-cat').value
        },
        notes: '',
        homework: '',
        createdAt: Date.now()
      };
      lessons.push(newLesson);
      persist();
      selectedDate = newLesson.date;
      closeModal();
      renderShell();
      showToast('予定を追加しました', 'ok');
    });
  }

  }

  function openClassroomMasterModal(){ renderClassroomMasterModal(null); }
  function closeClassroomMasterModal(){
    classroomOverlayRoot.innerHTML = '';
    refreshClassroomSelect();
  }

  function renderClassroomMasterModal(editId){
    var editing = editId ? classroomMaster.find(function(c){ return c.id === editId; }) : null;
    var html = '<div class="sheet-overlay" id="classroom-master-overlay">';
    html += '<div class="sheet-backdrop" data-action="close-classroom-master"></div>';
    html += '<div class="sheet">';
    html += '<div class="sheet__grabber-row"><div class="sheet__grabber"></div></div>';
    html += '<div class="sheet__header"><div class="sheet__header-text"><div class="sheet__header-title">教室マスタを管理</div><div class="sheet__header-sub">名称・時間・場所を登録しておくと予定作成が早くなります</div></div><button class="sheet__close tappable" data-action="close-classroom-master">✕</button></div>';
    html += '<div class="sheet__body">';
    html += '<div><div class="field-label">登録済みの教室</div>';
    if(classroomMaster.length === 0){
      html += '<div class="classroom-empty">まだ登録がありません</div>';
    } else {
      html += '<div class="classroom-list">';
      classroomMaster.forEach(function(c){
        html += '<div class="classroom-row">';
        html += '<div class="classroom-row__body"><div class="classroom-row__name">' + esc(c.name) + '</div><div class="classroom-row__meta mono">' + esc(c.start) + '〜' + esc(c.end) + ' ・ ' + esc(c.rink) + '</div></div>';
        html += '<div class="classroom-row__actions">';
        html += '<button class="icon-btn tappable" data-action="edit-classroom-row" data-id="' + c.id + '">✏️</button>';
        html += '<button class="icon-btn icon-btn--danger tappable" data-action="delete-classroom-row" data-id="' + c.id + '">🗑</button>';
        html += '</div></div>';
      });
      html += '</div>';
    }
    html += '</div>';
    html += '<div>';
    html += '<div class="classroom-form-title">' + (editing ? '教室を編集' : '新しい教室を登録') + (editing ? '<span class="classroom-cancel-edit tappable" data-action="cancel-edit-classroom">キャンセル</span>' : '') + '</div>';
    html += '<div style="margin-top:10px;"><div class="field-label">教室名</div><input type="text" id="cm-name" class="text-input" placeholder="例：大人スケート教室" value="' + (editing ? esc(editing.name) : '') + '"></div>';
    html += '<div class="grid-2" style="margin-top:12px;">';
    html += '<div><div class="field-label">開始</div><input type="time" id="cm-start" class="date-input" value="' + (editing ? esc(editing.start) : '18:00') + '"></div>';
    html += '<div><div class="field-label">終了</div><input type="time" id="cm-end" class="date-input" value="' + (editing ? esc(editing.end) : '19:00') + '"></div>';
    html += '</div>';
    html += '<div style="margin-top:12px;"><div class="field-label">リンク</div><div class="rink-row" id="cm-rink-row">';
    RINKS.forEach(function(r, idx){
      var isSel = editing ? (editing.rink === r) : (idx === 0);
      html += '<button class="rink-btn tappable min-tap' + (isSel?' is-selected':'') + '" data-rink="' + esc(r) + '">' + esc(r) + '</button>';
    });
    html += '</div></div>';
    html += '</div>';
    html += '</div>';
    html += '<div class="sheet__footer"><button class="sheet__submit tappable" id="btn-save-classroom">' + (editing ? 'この内容で更新する' : 'この内容で登録する') + '</button></div>';
    html += '</div></div>';
    classroomOverlayRoot.innerHTML = html;
    attachClassroomMasterListeners(editId);
  }

  function attachClassroomMasterListeners(editId){
    var overlay = document.getElementById('classroom-master-overlay');
    overlay.addEventListener('click', function(e){
      var actionEl = e.target.closest('[data-action]');
      if(!actionEl) return;
      var action = actionEl.dataset.action;
      if(action === 'close-classroom-master'){
        closeClassroomMasterModal();
      } else if(action === 'edit-classroom-row'){
        renderClassroomMasterModal(actionEl.dataset.id);
      } else if(action === 'cancel-edit-classroom'){
        renderClassroomMasterModal(null);
      } else if(action === 'delete-classroom-row'){
        if(window.confirm('この教室をマスタから削除しますか？（過去の予定データは残ります）')){
          classroomMaster = classroomMaster.filter(function(c){ return c.id !== actionEl.dataset.id; });
          persistClassrooms();
          renderClassroomMasterModal(null);
          refreshClassroomSelect();
          showToast('教室を削除しました', 'navy');
        }
      }
    });

    var cmRinkRow = document.getElementById('cm-rink-row');
    cmRinkRow.addEventListener('click', function(e){
      var btn = e.target.closest('.rink-btn');
      if(!btn) return;
      Array.prototype.forEach.call(cmRinkRow.querySelectorAll('.rink-btn'), function(el){ el.classList.remove('is-selected'); });
      btn.classList.add('is-selected');
    });

    document.getElementById('btn-save-classroom').addEventListener('click', function(){
      var nameInput = document.getElementById('cm-name');
      var name = nameInput.value.trim();
      if(!name){ showToast('教室名を入力してください', 'danger'); return; }
      var start = document.getElementById('cm-start').value || '18:00';
      var end = document.getElementById('cm-end').value || '19:00';
      var rinkBtn = cmRinkRow.querySelector('.rink-btn.is-selected');
      var rink = rinkBtn ? rinkBtn.dataset.rink : RINKS[0];

      if(editId){
        var target = classroomMaster.find(function(c){ return c.id === editId; });
        if(target){ target.name = name; target.start = start; target.end = end; target.rink = rink; }
      } else {
        classroomMaster.push({ id: uid(), name: name, start: start, end: end, rink: rink });
      }
      persistClassrooms();
      refreshClassroomSelect();
      renderClassroomMasterModal(null);
      showToast(editId ? '教室を更新しました' : '教室を登録しました', 'ok');
    });
  }

  /* パスワード（ロック）設定モーダル */
  function openPasscodeSettingsModal(){
    var html = '<div class="sheet-overlay" id="passcode-modal-overlay">';
    html += '<div class="sheet-backdrop" data-action="close-passcode-modal"></div>';
    html += '<div class="sheet">';
    html += '<div class="sheet__grabber-row"><div class="sheet__grabber"></div></div>';
    html += '<div class="sheet__header"><div class="sheet__header-text"><div class="sheet__header-title">🔒 アプリのパスワード設定</div></div><button class="sheet__close tappable" data-action="close-passcode-modal">✕</button></div>';
    html += '<div class="sheet__body">';
    html += '<div style="font-size:12px; color:var(--text-sub);">アプリ起動時または復帰時にパスワードを要求するように設定します。</div>';
    html += '<div><div class="field-label">新しいパスワード（数字4〜8桁）</div><input type="password" id="setting-pass-1" class="text-input mono" pattern="[0-9]*" inputmode="numeric" placeholder="未設定にする場合は空欄"></div>';
    html += '<div><div class="field-label">パスワード再入力</div><input type="password" id="setting-pass-2" class="text-input mono" pattern="[0-9]*" inputmode="numeric" placeholder="確認のためもう一度入力"></div>';
    if(savedPasscode) {
      html += '<button class="delete-link tappable" id="btn-remove-passcode">パスワード保護を解除（未設定にする）</button>';
    }
    html += '</div>';
    html += '<div class="sheet__footer"><button class="sheet__submit tappable" id="btn-save-passcode">保存する</button></div>';
    html += '</div></div>';
    classroomOverlayRoot.innerHTML = html;

    var overlay = document.getElementById('passcode-modal-overlay');
    overlay.addEventListener('click', function(e){
      var actionEl = e.target.closest('[data-action]');
      if(actionEl && actionEl.dataset.action === 'close-passcode-modal') classroomOverlayRoot.innerHTML = '';
    });

    document.getElementById('btn-save-passcode').addEventListener('click', function(){
      var p1 = document.getElementById('setting-pass-1').value.trim();
      var p2 = document.getElementById('setting-pass-2').value.trim();
      if(p1 !== p2){
        showToast('パスワードが一致しません', 'danger');
        return;
      }
      savedPasscode = p1;
      savePasscode(p1);
      classroomOverlayRoot.innerHTML = '';
      showToast(p1 ? 'パスワードを設定しました' : 'パスワードを解除しました', 'ok');
    });

    var btnRemove = document.getElementById('btn-remove-passcode');
    if(btnRemove){
      btnRemove.addEventListener('click', function(){
        savedPasscode = '';
        savePasscode('');
        classroomOverlayRoot.innerHTML = '';
        showToast('パスワード保護を解除しました', 'navy');
      });
    }
  }

  rootEl.addEventListener('click', function(e){
    var el = e.target.closest('[data-action]');
    if(!el) return;
    var action = el.dataset.action;
    if(action === 'select-date') selectDate(el.dataset.date);
    else if(action === 'switch-tab') switchTab(el.dataset.tab);
    else if(action === 'open-lesson') openLessonModal(el.dataset.id);
    else if(action === 'quick-line') quickLine(el.dataset.id);
    else if(action === 'toggle-payment') togglePaymentFromFinance(el.dataset.id);
    else if(action === 'open-add') openAddSheet();
    else if(action === 'export-csv') exportCsv();
    else if(action === 'year-prev') changeFinanceYear(-1);
    else if(action === 'year-next') changeFinanceYear(1);
    else if(action === 'set-view') setViewMode(el.dataset.view);
    else if(action === 'cal-prev-month') calPrevMonth();
    else if(action === 'cal-next-month') calNextMonth();
    else if(action === 'open-classroom-master') openClassroomMasterModal();
    else if(action === 'open-passcode-settings') openPasscodeSettingsModal();
  });

  renderShell();
})();
</script>
</body>
</html>
