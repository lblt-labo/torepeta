
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<title>トレペタ - for Figure Skating Coaches -</title>
<meta name="theme-color" content="#002b49">
<!-- PWA: ホーム画面追加時にアドレスバーなしの全画面（Standalone）で起動するための設定 -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="トレペタ">

<!-- ★ 修正ポイント1: 正しい manifest.json ファイルを読み込む -->
<link rel="manifest" href="./manifest.json">

<!-- ★ 修正ポイント2: アップロードしたスケート靴アイコンを指定する -->
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="icon" type="image/png" href="./icon-192.png">

<!-- ★ 修正ポイント3: Service Worker を登録する -->
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    });
  }
</script>
<style>:root{
  --snow:#F5F9FC;
  --snow-deep:#E7F0F6;
  --ice:#2FB6E0;
  --ice-deep:#1590B8;
  --ice-bg:#E1F4FA;
  --navy:#0B2545;
  --navy-soft:#173763;
  --line-gray:#D6DEE6;
  --panel-gray:#EEF2F6;
  --personal:#2D6CDF;
  --personal-bg:#E8F0FE;
  --group:#1E8E5A;
  --group-bg:#E5F6EC;
  --rental:#D9720C;
  --rental-bg:#FCEEDC;
  --kyoshitsu:#6B46C1;
  --kyoshitsu-bg:#EDE7FB;
  --danger:#C4291C;
  --danger-bg:#FBE9E7;
  --ok:#1E8E5A;
  --ok-bg:#E5F6EC;
  --advice:#8A6D00;
  --advice-bg:#FFF9E6;
  --advice-border:#F0D060;
}
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ height:100%; }
body{
  margin:0;
  font-family:-apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
  color:var(--navy);
  background:
    radial-gradient(circle at 10% 0%, #ffffff 0%, transparent 45%),
    linear-gradient(180deg, var(--snow) 0%, var(--snow-deep) 100%);
  background-attachment:fixed;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
button, input, textarea{ font-family:inherit; }
button{ border:none; background:none; padding:0; cursor:pointer; -webkit-appearance:none; appearance:none; }
input, textarea{ background:#fff; color:var(--navy); }
h1,h2,h3,p{ margin:0; }
::-webkit-scrollbar{ display:none; }
*{ scrollbar-width:none; }
.mono{ font-variant-numeric:tabular-nums; font-family: "SFMono-Regular", Consolas, Menlo, monospace; }
.tappable{ transition: transform .12s ease, background-color .12s ease, box-shadow .12s ease; touch-action:manipulation; }
.tappable:active{ transform:scale(.96); }
.min-tap{ min-height:44px; min-width:44px; }
.app{ max-width:560px; margin:0 auto; min-height:100vh; min-height:100dvh; display:flex; flex-direction:column; position:relative; }
.app-header{
  position:sticky; top:0; z-index:40;
  padding:14px 20px 8px;
  padding-top:calc(14px + env(safe-area-inset-top));
  background:linear-gradient(180deg, var(--navy) 0%, var(--navy-soft) 100%);
  display:flex; align-items:center; justify-content:space-between; gap:10px;
}
.app-header__brand{ display:flex; align-items:center; gap:10px; min-width:0; }
.app-header__logo{ width:38px; height:38px; border-radius:12px; background:rgba(255,255,255,.15); display:flex; align-items:center; justify-content:center; font-size:18px; flex-shrink:0; }
.app-header__title{ color:#fff; font-size:17px; font-weight:900; line-height:1.15; letter-spacing:-.01em; white-space:nowrap; }
.app-header__subtitle{ color:rgba(255,255,255,.62); font-size:10px; font-weight:700; margin-top:2px; white-space:nowrap; }
.app-header__alert{ flex-shrink:0; background:rgba(255,255,255,.16); color:#fff; font-size:11px; font-weight:700; padding:7px 10px; border-radius:12px; white-space:nowrap; }
.app-header__right{ display:flex; align-items:center; gap:8px; flex-shrink:0; }
.header-gear{ width:36px; height:36px; border-radius:50%; background:rgba(255,255,255,.16); color:#fff; display:flex; align-items:center; justify-content:center; font-size:16px; flex-shrink:0; }
.date-strip{
  position:sticky; top:0; z-index:30;
  display:flex; gap:8px; overflow-x:auto; padding:12px 16px;
  background:var(--navy-soft);
}
.date-chip{
  flex-shrink:0; width:56px; padding:8px 0;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
  border-radius:16px; border:2px solid transparent; background:#fff;
}
.date-chip.is-selected{ background:var(--navy); border-color:var(--navy); }
.date-chip__weekday{ font-size:11px; font-weight:700; color:var(--navy-soft); }
.date-chip__weekday.is-sun{ color:var(--danger); }
.date-chip__weekday.is-sat{ color:var(--personal); }
.date-chip.is-selected .date-chip__weekday{ color:rgba(255,255,255,.7); }
.date-chip__day{ font-size:17px; font-weight:900; color:var(--navy); }
.date-chip.is-selected .date-chip__day{ color:#fff; }
.date-chip__today-dot{ width:6px; height:6px; border-radius:50%; background:var(--ice); }
.date-chip__count{ font-size:9px; font-weight:800; color:var(--ice-deep); }
.date-chip.is-selected .date-chip__count{ color:#fff; }
.view-toggle{ display:flex; gap:8px; padding:10px 16px 2px; }
.view-toggle__btn{ flex:1; min-height:40px; border-radius:12px; font-size:12.5px; font-weight:800; background:var(--panel-gray); color:var(--navy-soft); display:flex; align-items:center; justify-content:center; }
.view-toggle__btn.is-active{ background:var(--navy); color:#fff; }
.month-calendar{ padding:8px 16px 4px; }
.month-calendar__nav{ display:flex; align-items:center; justify-content:space-between; padding:2px 2px 12px; }
.month-calendar__nav-btn{ width:34px; height:34px; border-radius:50%; background:var(--panel-gray); font-weight:900; font-size:15px; display:flex; align-items:center; justify-content:center; }
.month-calendar__label{ font-size:15px; font-weight:900; }
.month-calendar__weekdays{ display:grid; grid-template-columns:repeat(7,1fr); text-align:center; margin-bottom:6px; }
.month-calendar__weekday{ font-size:11px; font-weight:800; color:var(--navy-soft); padding:4px 0; }
.month-calendar__weekday.is-sun{ color:var(--danger); }
.month-calendar__weekday.is-sat{ color:var(--personal); }
.month-calendar__grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:4px; }
.month-calendar__cell{ aspect-ratio:1/1; border-radius:12px; background:#fff; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; border:2px solid transparent; box-shadow:0 1px 2px rgba(11,37,69,.05); }
.month-calendar__cell.is-empty{ background:transparent; box-shadow:none; }
.month-calendar__cell.is-today{ border-color:var(--ice); }
.month-calendar__cell.is-selected{ background:var(--navy); border-color:var(--navy); }
.month-calendar__cell-day{ font-size:13px; font-weight:800; color:var(--navy); }
.month-calendar__cell-day.is-sun{ color:var(--danger); }
.month-calendar__cell-day.is-sat{ color:var(--personal); }
.month-calendar__cell.is-selected .month-calendar__cell-day{ color:#fff; }
.month-calendar__cell-dot{ width:5px; height:5px; border-radius:50%; background:var(--ice-deep); }
.month-calendar__cell.is-selected .month-calendar__cell-dot{ background:#fff; }
.main-scroll{ flex:1; }
.section-heading{ display:flex; align-items:center; justify-content:space-between; padding:12px 16px 4px; }
.section-heading__title{ font-size:15px; font-weight:900; }
.section-heading__meta{ font-size:12px; font-weight:700; color:var(--navy-soft); }
.lesson-list{ padding:4px 16px 112px; display:flex; flex-direction:column; gap:12px; }
.empty-state{ text-align:center; padding:60px 20px; }
.empty-state__icon{ font-size:40px; }
.empty-state__text{ font-size:13px; font-weight:700; color:var(--navy-soft); margin-top:8px; }
.empty-state__btn{ margin-top:16px; padding:10px 20px; border-radius:16px; font-weight:800; font-size:13px; color:#fff; background:var(--navy); display:inline-block; }
.lesson-tile{ position:relative; background:#fff; border-radius:16px; overflow:hidden; box-shadow:0 1px 2px rgba(11,37,69,.06), 0 6px 16px -8px rgba(11,37,69,.14); }
.lesson-tile__accent{ position:absolute; left:0; top:0; bottom:0; width:6px; }
.lesson-tile__main{ width:100%; text-align:left; padding:12px 12px 10px 20px; display:flex; align-items:flex-start; gap:12px; }
.lesson-tile__time{ width:52px; flex-shrink:0; display:flex; flex-direction:column; align-items:center; padding-top:4px; }
.lesson-tile__time-start{ font-size:15px; font-weight:800; color:var(--navy); line-height:1; }
.lesson-tile__time-end{ font-size:10px; color:var(--navy-soft); margin-top:4px; }
.lesson-tile__body{ flex:1; min-width:0; }
.lesson-tile__title-row{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
.lesson-tile__student{ font-size:15px; font-weight:800; max-width:46vw; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.lesson-tile__type-label{ font-size:10px; font-weight:800; padding:2px 6px; border-radius:8px; flex-shrink:0; }
.lesson-tile__sub{ font-size:12px; color:var(--navy-soft); margin-top:2px; }
.lesson-tile__badges{ display:flex; align-items:center; gap:6px; margin-top:8px; flex-wrap:wrap; }
.lesson-tile__tagcount{ font-size:11px; color:var(--navy-soft); }
.lesson-tile__actions{ padding:0 12px 12px 20px; }
.type-badge{ flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:20px; border-width:2px; border-style:solid; }
.type-badge--sm{ width:32px; height:32px; font-size:15px; }
.type-badge--md{ width:44px; height:44px; }
.type-badge.shape-circle{ border-radius:50%; }
.type-badge.shape-round{ border-radius:14px; }
.type-badge.shape-hex{ border-radius:6px; clip-path: polygon(25% 3%, 75% 3%, 100% 50%, 75% 97%, 25% 97%, 0% 50%); }
.type-badge.shape-square{ border-radius:6px; }
.type-personal{ color:var(--personal); background:var(--personal-bg); border-color:var(--personal); }
.type-group{ color:var(--group); background:var(--group-bg); border-color:var(--group); }
.type-rental{ color:var(--rental); background:var(--rental-bg); border-color:var(--rental); }
.type-kyoshitsu{ color:var(--kyoshitsu); background:var(--kyoshitsu-bg); border-color:var(--kyoshitsu); }
.accent-personal{ background:var(--personal); }
.accent-group{ background:var(--group); }
.accent-rental{ background:var(--rental); }
.accent-kyoshitsu{ background:var(--kyoshitsu); }
.status-pill{ display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:800; padding:3px 9px; border-radius:999px; border:1px solid var(--line-gray); background:var(--panel-gray); color:var(--navy-soft); }
.status-pill__dot{ width:8px; height:8px; border-radius:50%; background:#9AA9B8; flex-shrink:0; }
.status-pill--contact.is-on{ color:var(--ice-deep); background:var(--ice-bg); border-color:var(--ice-deep); }
.status-pill--contact.is-on .status-pill__dot{ background:var(--ice-deep); }
.status-pill--payment.is-on{ color:var(--ok); background:var(--ok-bg); border-color:var(--ok); }
.status-pill--payment.is-on .status-pill__dot{ background:var(--ok); }
.btn-line{ width:100%; min-height:44px; border-radius:14px; font-size:13px; font-weight:800; display:flex; align-items:center; justify-content:center; gap:7px; color:#fff; background:#06C755; }
.btn-line.is-done{ background:var(--panel-gray); color:var(--navy-soft); }
.fab{ position:fixed; z-index:50; width:64px; height:64px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:#fff; font-size:28px; background:var(--ice); box-shadow:0 10px 24px -6px rgba(11,37,69,.4); right:max(20px, calc(50vw - 260px)); bottom:calc(96px + env(safe-area-inset-bottom)); }
.bottom-nav{ position:fixed; left:0; right:0; bottom:0; z-index:40; max-width:560px; margin:0 auto; background:#fff; border-top:1px solid rgba(23,55,99,.1); display:flex; padding-bottom:env(safe-area-inset-bottom); }
.nav-btn{ flex:1; padding:10px 0 8px; display:flex; flex-direction:column; align-items:center; gap:2px; color:var(--navy-soft); }
.nav-btn.is-active{ color:var(--ice-deep); }
.nav-btn__icon{ font-size:20px; }
.nav-btn__label{ font-size:11px; font-weight:800; }
.nav-btn__indicator{ width:22px; height:3px; border-radius:999px; margin-top:2px; background:transparent; }
.nav-btn.is-active .nav-btn__indicator{ background:var(--ice); }
.sheet-overlay{ position:fixed; inset:0; z-index:100; display:flex; align-items:flex-end; }
.sheet-backdrop{ position:absolute; inset:0; background:rgba(11,37,69,.42); backdrop-filter:blur(1px); -webkit-backdrop-filter:blur(1px); }
.sheet{ position:relative; width:100%; max-width:560px; margin:0 auto; max-height:92vh; background:#fff; border-radius:24px 24px 0 0; box-shadow:0 -8px 30px rgba(11,37,69,.25); display:flex; flex-direction:column; animation:sheetSlideUp .26s cubic-bezier(.22,.9,.32,1); }
@keyframes sheetSlideUp{ from{ transform:translateY(100%);} to{ transform:translateY(0);} }
.sheet__grabber-row{ display:flex; justify-content:center; padding:10px 0 4px; flex-shrink:0; }
.sheet__grabber{ width:40px; height:6px; border-radius:999px; background:rgba(23,55,99,.22); }
.sheet__header{ padding:0 20px 12px; display:flex; align-items:center; gap:12px; border-bottom:1px solid rgba(23,55,99,.1); flex-shrink:0; }
.sheet__header-text{ flex:1; min-width:0; }
.sheet__header-title{ font-size:16px; font-weight:900; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.sheet__header-sub{ font-size:12px; color:var(--navy-soft); margin-top:2px; }
.sheet__close{ width:36px; height:36px; border-radius:50%; background:var(--panel-gray); display:flex; align-items:center; justify-content:center; font-size:18px; flex-shrink:0; }
.sheet__body{ overflow-y:auto; flex:1; padding:16px 20px; display:flex; flex-direction:column; gap:20px; }
.sheet__footer{ padding:16px 20px; padding-bottom:calc(16px + env(safe-area-inset-bottom)); border-top:1px solid rgba(23,55,99,.1); flex-shrink:0; }
.sheet__submit{ width:100%; min-height:48px; border-radius:16px; font-weight:900; font-size:15px; color:#fff; background:var(--navy); }
.sheet__submit:disabled{ opacity:.4; }
.field-label{ font-size:13px; font-weight:900; margin-bottom:8px; }
.text-input, .select-like, .date-input{ width:100%; border-radius:16px; border:2px solid rgba(23,55,99,.15); padding:12px; font-size:15px; }
.text-input:focus, .date-input:focus{ outline:none; border-color:var(--ice); }
.grid-3{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
.grid-2{ display:grid; grid-template-columns:repeat(2,1fr); gap:8px; }
.select-wrap{ position:relative; }
.select-wrap::after{ content:'▾'; position:absolute; right:14px; top:50%; transform:translateY(-50%); color:var(--navy-soft); font-size:13px; pointer-events:none; }
.select-input{ width:100%; border-radius:16px; border:2px solid rgba(23,55,99,.15); padding:12px; padding-right:36px; font-size:14px; background:#fff; color:var(--navy); appearance:none; -webkit-appearance:none; -moz-appearance:none; }
.select-input:focus{ outline:none; border-color:var(--ice); }
.classroom-manage-link{ display:inline-block; margin-top:8px; font-size:12px; font-weight:800; color:var(--ice-deep); text-decoration:underline; text-underline-offset:3px; padding:4px 2px; }
.classroom-row{ display:flex; align-items:center; gap:10px; background:#fff; border-radius:14px; padding:10px 12px; box-shadow:0 1px 2px rgba(11,37,69,.06); }
.classroom-row__body{ flex:1; min-width:0; }
.classroom-row__name{ font-size:14px; font-weight:800; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.classroom-row__meta{ font-size:11px; color:var(--navy-soft); margin-top:2px; }
.classroom-row__actions{ display:flex; gap:6px; flex-shrink:0; }
.icon-btn{ width:36px; height:36px; border-radius:50%; background:var(--panel-gray); display:flex; align-items:center; justify-content:center; font-size:15px; flex-shrink:0; }
.icon-btn--danger{ color:var(--danger); }
.classroom-list{ display:flex; flex-direction:column; gap:8px; }
.classroom-empty{ text-align:center; padding:22px; font-size:13px; font-weight:700; color:var(--navy-soft); background:#fff; border-radius:14px; }
.classroom-form-title{ font-size:13px; font-weight:900; display:flex; align-items:center; justify-content:space-between; }
.classroom-cancel-edit{ font-size:12px; font-weight:800; color:var(--navy-soft); text-decoration:underline; text-underline-offset:2px; }
.advice-box{ border-radius:16px; padding:14px; border:2px solid var(--advice-border); background:var(--advice-bg); }
.advice-box__title{ display:flex; align-items:center; gap:6px; font-size:12px; font-weight:900; color:var(--advice); }
.advice-box__text{ font-size:13.5px; margin-top:6px; line-height:1.6; color:#5C4900; }
.action-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.action-btn{ min-height:44px; border-radius:16px; padding:12px 6px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; font-weight:800; font-size:13px; border:2px solid transparent; }
.action-btn__icon{ font-size:20px; }
.action-btn--line{ background:#06C755; color:#fff; }
.action-btn--line.is-done{ background:var(--panel-gray); color:var(--navy-soft); }
.action-btn--pay{ background:var(--panel-gray); color:var(--navy-soft); }
.action-btn--pay.is-done{ background:var(--ok-bg); color:var(--ok); border-color:var(--ok); }
.money-box{ border-radius:16px; background:var(--snow-deep); padding:14px; }
.money-row{ display:flex; align-items:center; justify-content:between; justify-content:space-between; }
.money-row + .money-row{ margin-top:12px; padding-top:12px; border-top:1px solid rgba(23,55,99,.1); }
.money-row__label{ font-size:13px; font-weight:800; color:var(--navy-soft); }
.money-row__value{ display:flex; align-items:center; gap:4px; }
.fee-input{ width:100px; text-align:right; font-size:16px; font-weight:800; border:none; background:transparent; border-bottom:2px solid rgba(23,55,99,.3); border-radius:0; padding:2px 0; }
.fee-input:focus{ outline:none; border-color:var(--ice); }
.stepper{ display:flex; align-items:center; gap:8px; }
.stepper__btn{ width:32px; height:32px; border-radius:50%; background:#fff; font-weight:900; display:flex; align-items:center; justify-content:center; }
.split-input{ width:32px; text-align:center; font-weight:800; border:none; background:transparent; padding:0; }
.per-person-note{ margin-top:8px; font-size:12px; font-weight:800; color:var(--rental); }
.tag-wrap{ display:flex; flex-wrap:wrap; gap:8px; }
.tag-chip{ min-height:44px; padding:9px 14px; border-radius:14px; font-size:13px; font-weight:800; border:2px solid var(--line-gray); background:#fff; color:var(--navy); }
.tag-chip.is-selected{ background:var(--navy); border-color:var(--navy); color:#fff; }
.notes-header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
.mic-btn{ width:44px; height:44px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:18px; color:#fff; background:var(--ice); }
.mic-btn.is-recording{ background:var(--danger); animation:micPulse 1.4s infinite; }
@keyframes micPulse{ 0%,100%{ box-shadow:0 0 0 0 rgba(196,41,28,.45);} 50%{ box-shadow:0 0 0 12px rgba(196,41,28,0);} }
.mic-unsupported{ font-size:11px; color:var(--navy-soft); }
.recording-hint{ font-size:11px; font-weight:800; color:var(--danger); margin-bottom:6px; }
.notes-textarea{ width:100%; min-height:96px; border-radius:16px; border:2px solid rgba(23,55,99,.15); padding:12px; font-size:14px; line-height:1.6; resize:vertical; }
.notes-textarea:focus{ outline:none; border-color:var(--ice); }
.delete-link{ text-align:center; font-size:13px; font-weight:800; color:var(--danger); padding:8px 0; width:100%; }
.type-select-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:8px; }
.type-select-btn{ min-height:44px; border-radius:16px; padding:12px 4px; display:flex; flex-direction:row; align-items:center; justify-content:center; gap:8px; border:2px solid #E3E9EE; background:#fff; }
.type-select-btn.is-selected.sel-personal{ border-color:var(--personal); background:var(--personal-bg); }
.type-select-btn.is-selected.sel-group{ border-color:var(--group); background:var(--group-bg); }
.type-select-btn.is-selected.sel-rental{ border-color:var(--rental); background:var(--rental-bg); }
.type-select-btn.is-selected.sel-kyoshitsu{ border-color:var(--kyoshitsu); background:var(--kyoshitsu-bg); }
.type-select-btn__icon{ width:32px; height:32px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.type-select-btn__label{ font-size:12px; font-weight:800; }
.rink-row{ display:flex; flex-wrap:wrap; gap:8px; }
.rink-btn{ min-height:44px; padding:10px 14px; border-radius:14px; font-size:13px; font-weight:800; border:2px solid #E3E9EE; background:#fff; color:var(--navy); }
.rink-btn.is-selected{ background:var(--navy); border-color:var(--navy); color:#fff; }
.finance-view{ padding:8px 16px 112px; }
.finance-year{ display:flex; align-items:center; justify-content:space-between; padding:4px 4px 12px; }
.year-nav{ display:flex; align-items:center; gap:8px; }
.year-nav__btn{ width:36px; height:36px; border-radius:50%; background:#fff; box-shadow:0 1px 2px rgba(11,37,69,.08); font-weight:900; display:flex; align-items:center; justify-content:center; }
.year-nav__label{ font-size:18px; font-weight:900; }
.btn-csv{ min-height:44px; padding:10px 16px; border-radius:16px; font-size:13px; font-weight:900; color:#fff; background:var(--ice-deep); display:flex; align-items:center; gap:6px; }
.summary-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:16px; }
.summary-card{ border-radius:16px; padding:14px; background:#fff; box-shadow:0 1px 2px rgba(11,37,69,.06), 0 6px 16px -8px rgba(11,37,69,.12); border:2px solid; }
.summary-card--paid{ border-color:var(--ok); }
.summary-card--unpaid{ border-color:var(--danger); }
.summary-card__label{ font-size:12px; font-weight:800; color:var(--navy-soft); }
.summary-card__value{ font-size:22px; font-weight:900; margin-top:4px; }
.summary-card--paid .summary-card__value{ color:var(--ok); }
.summary-card--unpaid .summary-card__value{ color:var(--danger); }
.summary-card__count{ font-size:11px; color:var(--navy-soft); margin-top:2px; }
.list-title{ font-size:13px; font-weight:900; margin:0 4px 8px; }
.unpaid-empty{ text-align:center; padding:40px 20px; font-size:13px; font-weight:700; color:var(--navy-soft); background:#fff; border-radius:16px; box-shadow:0 1px 2px rgba(11,37,69,.06); }
.unpaid-list{ display:flex; flex-direction:column; gap:8px; margin-bottom:20px; }
.unpaid-row{ width:100%; background:#fff; border-radius:16px; box-shadow:0 1px 2px rgba(11,37,69,.06); padding:10px 12px; display:flex; align-items:center; gap:12px; }
.unpaid-row__body{ flex:1; min-width:0; text-align:left; }
.unpaid-row__name{ font-size:13.5px; font-weight:800; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.unpaid-row__date{ font-size:11px; color:var(--navy-soft); margin-top:1px; }
.unpaid-row__right{ text-align:right; flex-shrink:0; }
.unpaid-row__fee{ font-size:14px; font-weight:900; }
.unpaid-row__cta{ font-size:10px; font-weight:800; color:var(--danger); margin-top:1px; }
.breakdown-card{ background:#fff; border-radius:16px; box-shadow:0 1px 2px rgba(11,37,69,.06); padding:14px; display:flex; flex-direction:column; gap:10px; }
.breakdown-row{ display:flex; align-items:center; gap:10px; }
.breakdown-row__icon{ width:24px; height:24px; display:flex; align-items:center; justify-content:center; font-size:11px; flex-shrink:0; }
.breakdown-row__label{ font-size:13px; font-weight:800; flex:1; }
.breakdown-row__count{ font-size:12px; color:var(--navy-soft); }
.breakdown-row__sum{ font-size:13px; font-weight:900; width:84px; text-align:right; }
#toast-root{ position:fixed; left:0; right:0; bottom:92px; z-index:200; display:flex; justify-content:center; pointer-events:none; }
.toast{ pointer-events:auto; max-width:88vw; padding:12px 16px; border-radius:16px; color:#fff; font-size:14px; font-weight:800; box-shadow:0 -8px 30px rgba(11,37,69,.25); animation:toastIn .2s ease-out; }
@keyframes toastIn{ from{ opacity:0; transform:translateY(10px);} to{ opacity:1; transform:translateY(0);} }
.toast--navy{ background:var(--navy); }
.toast--ok{ background:var(--ok); }
.toast--danger{ background:var(--danger); }</style>
</head>
<body>

<div class="app">
  <div id="root"></div>
</div>
<div id="overlay-root"></div>
<div id="classroom-overlay-root"></div>
<div id="toast-root"></div>

<script>(function(){
  // --- 定数定義 ---
  var STORAGE_KEY = 'torepeta_lessons_v1';
  var CLASSROOM_STORAGE_KEY = 'torepeta_classrooms_v1';
  var STUDENT_STORAGE_KEY = 'torepeta_students_v1';
  var SETTINGS_STORAGE_KEY = 'torepeta_settings_v1';

  var LESSON_TYPES = {
    personal: { name: '個人レッスン', short: '個人', icon: '👤', cls: 'type-badge--personal', shape: 'shape-rounded' },
    group: { name: 'グループレッスン', short: 'グループ', icon: '👥', cls: 'type-badge--group', shape: 'shape-circle' },
    kyoshitsu: { name: '教室', short: '教室', icon: '🏫', cls: 'type-badge--kyoshitsu', shape: 'shape-square' },
    rental: { name: '貸切', short: '貸切', icon: '⛸️', cls: 'type-badge--rental', shape: 'shape-pill' }
  };
  var TYPE_ORDER = ['personal', 'group', 'kyoshitsu', 'rental'];
  var RINKS = ['東伏見', '神宮', '横アリ', 'アクアリンク', 'その他'];
  var ALL_TAGS = ['ジャンプ', 'スピン', 'ステップ', '曲かけ', '初級', '中級', '上級', '振付', 'コンパルソリー'];

  // --- ステート ---
  var lessons = loadLessons();
  var classroomMaster = loadClassrooms();
  var studentMaster = loadStudents();
  var appSettings = loadSettings();

  var selectedDate = todayStr();
  var activeTab = 'schedule'; // 'schedule' | 'finance'
  var viewMode = 'day'; // 'day' | 'month'
  var calendarYearMonth = todayStr().substring(0, 7);
  var financeYear = new Date().getFullYear();

  var rootEl = document.getElementById('app-root');
  var overlayRoot = document.getElementById('overlay-root');
  var classroomOverlayRoot = document.getElementById('classroom-overlay-root');
  var toastContainer = document.getElementById('toast-container');

  // --- 初期化処理（パスワード確認） ---
  if (appSettings.password) {
    showPasswordLockModal();
  } else {
    renderShell();
  }

  // --- ローカルストレージアクセス ---
  function loadLessons() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : getInitialLessons();
    } catch(e) { return getInitialLessons(); }
  }
  function persist() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(lessons)); } catch(e){}
  }
  function loadClassrooms() {
    try {
      var raw = localStorage.getItem(CLASSROOM_STORAGE_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch(e) { return []; }
  }
  function persistClassrooms() {
    try { localStorage.setItem(CLASSROOM_STORAGE_KEY, JSON.stringify(classroomMaster)); } catch(e){}
  }
  function loadStudents() {
    try {
      var raw = localStorage.getItem(STUDENT_STORAGE_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch(e) { return []; }
  }
  function persistStudents() {
    try { localStorage.setItem(STUDENT_STORAGE_KEY, JSON.stringify(studentMaster)); } catch(e){}
  }
  function loadSettings() {
    try {
      var raw = localStorage.getItem(SETTINGS_STORAGE_KEY);
      return raw ? JSON.parse(raw) : { password: '' };
    } catch(e) { return { password: '' }; }
  }
  function persistSettings() {
    try { localStorage.setItem(SETTINGS_STORAGE_KEY, JSON.stringify(appSettings)); } catch(e){}
  }

  function getInitialLessons() {
    return [
      { id: 'sample-1', date: todayStr(), start: '09:00', end: '09:30', type: 'personal', student: '佐藤 ひなた', rink: '東伏見', fee: 4000, splitCount: 1, contactStatus: '未連絡', paymentStatus: '未回収', tags: ['ジャンプ', '曲かけ'], notes: 'アクセルの踏み込みを意識。', homework: '壁での軸作り10回', createdAt: Date.now() }
    ];
  }

  // --- ユーティリティ ---
  function todayStr() {
    var d = new Date();
    var y = d.getFullYear();
    var m = String(d.getMonth() + 1).padStart(2, '0');
    var day = String(d.getDate()).padStart(2, '0');
    return y + '-' + m + '-' + day;
  }
  function uid() { return 'id-' + Math.random().toString(36).substr(2, 9); }
  function esc(str) {
    if (!str) return '';
    return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function formatMoney(num) { return (num || 0).toLocaleString(); }
  function showToast(msg, type) {
    if (!toastContainer) return;
    var toast = document.createElement('div');
    toast.className = 'toast toast--' + (type || 'ok');
    toast.textContent = msg;
    toastContainer.appendChild(toast);
    setTimeout(function(){ toast.classList.add('is-show'); }, 10);
    setTimeout(function(){
      toast.classList.remove('is-show');
      setTimeout(function(){ if(toast.parentNode) toast.parentNode.removeChild(toast); }, 300);
    }, 2500);
  }
  function copyToClipboard(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text).then(function(){ return true; }).catch(function(){ return false; });
    }
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    var ok = false;
    try { ok = document.execCommand('copy'); } catch(e){}
    document.body.removeChild(ta);
    return Promise.resolve(ok);
  }
  function createRecognizer(onResult) {
    var SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) return null;
    var rec = new SpeechRecognition();
    rec.lang = 'ja-JP';
    rec.continuous = true;
    rec.interimResults = false;
    rec.onresult = function(e) {
      var text = '';
      for (var i = e.resultIndex; i < e.results.length; ++i) {
        if (e.results[i].isFinal) text += e.results[i][0].transcript;
      }
      if (text && onResult) onResult(text);
    };
    return rec;
  }

  // --- レンダリングメイン ---
  function renderShell() {
    var html = '';
    html += renderHeader();
    html += renderTabBar();
    html += '<main class="main-content">';
    if (activeTab === 'schedule') {
      html += renderScheduleTab();
    } else {
      html += renderFinanceTab();
    }
    html += '</main>';
    if (activeTab === 'schedule') {
      html += '<button class="fab-btn tappable" data-action="open-add">＋</button>';
    }
    rootEl.innerHTML = html;
  }

  function renderHeader() {
    var html = '<header class="app-header">';
    html += '<div class="app-header__title">トレペタ ⛸️</div>';
    html += '<button class="icon-btn tappable" data-action="open-settings-modal" title="設定">⚙️</button>';
    html += '</header>';
    return html;
  }

  function renderTabBar() {
    var html = '<div class="tab-bar">';
    html += '<button class="tab-item ' + (activeTab==='schedule'?'is-active':'') + '" data-action="switch-tab" data-tab="schedule">スケジュール</button>';
    html += '<button class="tab-item ' + (activeTab==='finance'?'is-active':'') + '" data-action="switch-tab" data-tab="finance">収支・回収</button>';
    html += '</div>';
    return html;
  }

  // --- スケジュールタブ ---
  function renderScheduleTab() {
    var html = '<div class="view-switch-row">';
    html += '<button class="view-switch-btn ' + (viewMode==='day'?'is-active':'') + '" data-action="set-view" data-view="day">日表示</button>';
    html += '<button class="view-switch-btn ' + (viewMode==='month'?'is-active':'') + '" data-action="set-view" data-view="month">月表示</button>';
    html += '</div>';

    if (viewMode === 'day') {
      html += renderDateStrip();
      html += renderDayLessonList();
    } else {
      html += renderMonthCalendar();
      html += renderDayLessonList();
    }
    return html;
  }

  function renderDateStrip() {
    var cur = new Date(selectedDate);
    var html = '<div class="date-strip">';
    for (var i = -3; i <= 3; i++) {
      var d = new Date(cur);
      d.setDate(d.getDate() + i);
      var dStr = d.toISOString().substring(0, 10);
      var isSel = dStr === selectedDate;
      var dayNum = d.getDate();
      var weekDays = ['日','月','火','水','木','金','土'];
      var wStr = weekDays[d.getDay()];
      html += '<div class="date-chip ' + (isSel?'is-selected':'') + '" data-action="select-date" data-date="' + dStr + '">';
      html += '<div class="date-chip__day">' + dayNum + '</div>';
      html += '<div class="date-chip__week">' + wStr + '</div>';
      html += '</div>';
    }
    html += '</div>';
    return html;
  }

  function renderMonthCalendar() {
    var parts = calendarYearMonth.split('-');
    var y = parseInt(parts[0], 10);
    var m = parseInt(parts[1], 10);

    var html = '<div class="month-cal">';
    html += '<div class="month-cal__header">';
    html += '<button class="icon-btn" data-action="cal-prev-month">◀</button>';
    html += '<span class="month-cal__title mono">' + y + '年 ' + m + '月</span>';
    html += '<button class="icon-btn" data-action="cal-next-month">▶</button>';
    html += '</div>';

    html += '<div class="month-cal__grid">';
    var weeks = ['日','月','火','水','木','金','土'];
    weeks.forEach(function(w){ html += '<div class="month-cal__weekday">' + w + '</div>'; });

    var firstDay = new Date(y, m - 1, 1).getDay();
    var daysInMonth = new Date(y, m, 0).getDate();

    for (var i = 0; i < firstDay; i++) {
      html += '<div class="month-cal__day is-empty"></div>';
    }

    for (var day = 1; day <= daysInMonth; day++) {
      var dStr = y + '-' + String(m).padStart(2,'0') + '-' + String(day).padStart(2,'0');
      var isSel = dStr === selectedDate;
      var dayLessons = lessons.filter(function(l){ return l.date === dStr; });
      var hasUnpaid = dayLessons.some(function(l){ return l.paymentStatus === '未回収'; });

      html += '<div class="month-cal__day ' + (isSel?'is-selected':'') + '" data-action="select-date" data-date="' + dStr + '">';
      html += '<span class="month-cal__num">' + day + '</span>';
      if (dayLessons.length > 0) {
        html += '<div class="month-cal__dots">';
        dayLessons.forEach(function(l){
          var t = LESSON_TYPES[l.type] || LESSON_TYPES.personal;
          html += '<span class="month-cal__dot ' + t.cls + '"></span>';
        });
        html += '</div>';
      }
      if (hasUnpaid) {
        html += '<span class="month-cal__unpaid-badge">未</span>';
      }
      html += '</div>';
    }
    html += '</div></div>';
    return html;
  }

  function renderDayLessonList() {
    var dayLessons = lessons.filter(function(l){ return l.date === selectedDate; });
    dayLessons.sort(function(a,b){ return a.start.localeCompare(b.start); });

    var html = '<div class="lesson-list">';
    html += '<div class="section-title">' + selectedDate + ' の予定 (' + dayLessons.length + '件)</div>';

    if (dayLessons.length === 0) {
      html += '<div class="empty-state">予定がありません。「＋」ボタンから追加できます。</div>';
    } else {
      dayLessons.forEach(function(l){
        var t = LESSON_TYPES[l.type] || LESSON_TYPES.personal;
        var isPaid = l.paymentStatus === '回収済';
        var isContacted = l.contactStatus === '連絡済';

        html += '<div class="lesson-card tappable" data-action="open-lesson" data-id="' + l.id + '">';
        html += '<div class="lesson-card__header">';
        html += '<span class="type-badge ' + t.shape + ' ' + t.cls + '">' + t.icon + ' ' + t.short + '</span>';
        html += '<span class="lesson-card__time mono">' + esc(l.start) + ' 〜 ' + esc(l.end) + '</span>';
        html += '<span class="lesson-card__rink">' + esc(l.rink) + '</span>';
        html += '</div>';

        html += '<div class="lesson-card__body">';
        html += '<div class="lesson-card__student">' + esc(l.student) + '</div>';
        var calcFee = l.type === 'rental' ? Math.round(l.fee / (l.splitCount || 1)) : l.fee;
        html += '<div class="lesson-card__fee mono">¥' + formatMoney(calcFee) + (l.type === 'rental' && l.splitCount > 1 ? ' <small>(' + l.splitCount + '割)</small>' : '') + '</div>';
        html += '</div>';

        html += '<div class="lesson-card__footer">';
        html += '<span class="status-pill ' + (isContacted?'is-done':'is-pending') + '">' + (isContacted?'連絡済':'未連絡') + '</span>';
        html += '<span class="status-pill ' + (isPaid?'is-done':'is-pending') + '">' + (isPaid?'回収済':'未回収') + '</span>';
        html += '<button class="quick-btn tappable" data-action="quick-line" data-id="' + l.id + '" onclick="event.stopPropagation();">💬 LINEコピー</button>';
        html += '</div>';
        html += '</div>';
      });
    }
    html += '</div>';
    return html;
  }

  // --- 収支タブ ---
  function renderFinanceTab() {
    var yearLessons = lessons.filter(function(l){ return l.date.indexOf(String(financeYear)) === 0; });

    var totalExpected = 0;
    var totalCollected = 0;

    yearLessons.forEach(function(l){
      var f = l.type === 'rental' ? Math.round(l.fee / (l.splitCount || 1)) : l.fee;
      totalExpected += f;
      if (l.paymentStatus === '回収済') totalCollected += f;
    });

    var uncollected = totalExpected - totalCollected;

    var html = '<div class="finance-container">';
    html += '<div class="year-selector">';
    html += '<button class="icon-btn" data-action="year-prev">◀</button>';
    html += '<span class="year-title mono">' + financeYear + '年 収支</span>';
    html += '<button class="icon-btn" data-action="year-next">▶</button>';
    html += '<button class="export-btn tappable" data-action="export-csv">📊 CSV出力</button>';
    html += '</div>';

    html += '<div class="finance-summary-grid">';
    html += '<div class="summary-card"><div class="summary-card__label">見込総額</div><div class="summary-card__value mono">¥' + formatMoney(totalExpected) + '</div></div>';
    html += '<div class="summary-card summary-card--ok"><div class="summary-card__label">回収済み</div><div class="summary-card__value mono">¥' + formatMoney(totalCollected) + '</div></div>';
    html += '<div class="summary-card summary-card--danger"><div class="summary-card__label">未回収</div><div class="summary-card__value mono">¥' + formatMoney(uncollected) + '</div></div>';
    html += '</div>';

    html += '<div class="section-title">未回収の予定一覧</div>';
    var uncollectedLessons = yearLessons.filter(function(l){ return l.paymentStatus === '未回収'; });
    uncollectedLessons.sort(function(a,b){ return a.date.localeCompare(b.date); });

    if (uncollectedLessons.length === 0) {
      html += '<div class="empty-state">🎉 未回収の予定はありません！</div>';
    } else {
      html += '<div class="uncollected-list">';
      uncollectedLessons.forEach(function(l){
        var calcFee = l.type === 'rental' ? Math.round(l.fee / (l.splitCount || 1)) : l.fee;
        html += '<div class="uncollected-row">';
        html += '<div class="uncollected-row__info">';
        html += '<div class="uncollected-row__date mono">' + esc(l.date) + ' ' + esc(l.start) + '</div>';
        html += '<div class="uncollected-row__student">' + esc(l.student) + ' (' + esc(l.rink) + ')</div>';
        html += '</div>';
        html += '<div class="uncollected-row__action">';
        html += '<span class="uncollected-row__fee mono">¥' + formatMoney(calcFee) + '</span>';
        html += '<button class="pay-toggle-btn tappable" data-action="toggle-payment" data-id="' + l.id + '">未回収</button>';
        html += '</div>';
        html += '</div>';
      });
      html += '</div>';
    }

    html += '</div>';
    return html;
  }

  // --- イベント操作 ---
  function selectDate(dStr) { selectedDate = dStr; renderShell(); }
  function switchTab(tab) { activeTab = tab; renderShell(); }
  function setViewMode(v) { viewMode = v; renderShell(); }
  function calPrevMonth() {
    var parts = calendarYearMonth.split('-');
    var d = new Date(parseInt(parts[0], 10), parseInt(parts[1], 10) - 2, 1);
    calendarYearMonth = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
    renderShell();
  }
  function calNextMonth() {
    var parts = calendarYearMonth.split('-');
    var d = new Date(parseInt(parts[0], 10), parseInt(parts[1], 10), 1);
    calendarYearMonth = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
    renderShell();
  }
  function changeFinanceYear(delta) { financeYear += delta; renderShell(); }

  function quickLine(id) {
    var lesson = lessons.find(function(l){ return l.id === id; });
    if (!lesson) return;
    var msg = buildLineMessage(lesson);
    copyToClipboard(msg).then(function(ok){
      if(ok){
        lesson.contactStatus = '連絡済';
        persist();
        renderShell();
        showToast('LINEメッセージをコピーしました📋', 'ok');
      } else {
        showToast('コピーに失敗しました', 'danger');
      }
    });
  }

  function togglePaymentFromFinance(id) {
    var lesson = lessons.find(function(l){ return l.id === id; });
    if (!lesson) return;
    lesson.paymentStatus = '回収済';
    persist();
    renderShell();
    showToast('回収済みに変更しました', 'navy');
  }

  function buildLineMessage(l) {
    var calcFee = l.type === 'rental' ? Math.round(l.fee / (l.splitCount || 1)) : l.fee;
    var msg = '【レッスンのお知らせ】\n';
    msg += '日時: ' + l.date + ' ' + l.start + '〜' + l.end + '\n';
    msg += '場所: ' + l.rink + '\n';
    msg += '対象: ' + l.student + '様\n';
    msg += '料金: ¥' + formatMoney(calcFee) + '\n';
    if(l.homework) msg += '宿題: ' + l.homework + '\n';
    msg += '\nよろしくお願いします！';
    return msg;
  }

  function exportCsv() {
    var yearLessons = lessons.filter(function(l){ return l.date.indexOf(String(financeYear)) === 0; });
    var csv = '日付,開始,終了,種別,生徒名/内容,リンク,料金,分割数,連絡状態,回収状態,メモ,宿題\n';
    yearLessons.forEach(function(l){
      csv += [
        l.date, l.start, l.end, (LESSON_TYPES[l.type]||{}).name||l.type,
        '"' + (l.student||'').replace(/"/g, '""') + '"',
        '"' + (l.rink||'').replace(/"/g, '""') + '"',
        l.fee, l.splitCount || 1, l.contactStatus, l.paymentStatus,
        '"' + (l.notes||'').replace(/"/g, '""') + '"',
        '"' + (l.homework||'').replace(/"/g, '""') + '"'
      ].join(',') + '\n';
    });
    var blob = new Blob([new Uint8Array([0xEF, 0xBB, 0xBF]), csv], { type: 'text/csv;charset=utf-8;' });
    var link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = 'torepeta_export_' + financeYear + '.csv';
    link.click();

  function attachLessonModalListeners(lesson) {
    var overlay = document.getElementById('lesson-overlay');
    overlay.addEventListener('click', function(e){
      var actionEl = e.target.closest('[data-action]');
      if (actionEl && actionEl.dataset.action === 'close-sheet') closeModal();
    });

    var feeInput = document.getElementById('fee-input');
    var splitInput = document.getElementById('split-input');
    var splitResult = document.getElementById('split-result');

    function currentFee(){ return Number(feeInput.value) || 0; }
    function currentSplit(){ return splitInput ? Math.max(1, Number(splitInput.value)||1) : 1; }
    function updateSplitCalc(){
      if(splitResult){
        var calc = Math.round(currentFee() / currentSplit());
        splitResult.textContent = '¥' + formatMoney(calc);
      }
    }

    if(feeInput) feeInput.addEventListener('input', updateSplitCalc);
    if(splitInput) splitInput.addEventListener('input', updateSplitCalc);

    var splitMinus = document.getElementById('split-minus');
    var splitPlus = document.getElementById('split-plus');
    if(splitMinus) splitMinus.addEventListener('click', function(){ splitInput.value = Math.max(1, currentSplit()-1); updateSplitCalc(); });
    if(splitPlus) splitPlus.addEventListener('click', function(){ splitInput.value = currentSplit()+1; updateSplitCalc(); });

    var tagGrid = document.getElementById('tag-grid');
    tagGrid.addEventListener('click', function(e){
      var btn = e.target.closest('.tag-btn');
      if(!btn) return;
      btn.classList.toggle('is-selected');
    });

    function currentTags(){
      var btns = tagGrid.querySelectorAll('.tag-btn.is-selected');
      var res = [];
      Array.prototype.forEach.call(btns, function(b){ res.push(b.dataset.tag); });
      return res;
    }

    document.getElementById('btn-line').addEventListener('click', function(){
      lesson.fee = currentFee();
      lesson.splitCount = currentSplit();
      var msg = buildLineMessage(lesson);
      copyToClipboard(msg).then(function(ok){
        if(ok){
          lesson.contactStatus = '連絡済';
          persist();
          renderShell();
          var btn = document.getElementById('btn-line');
          btn.classList.add('is-done');
          btn.innerHTML = '<span class="action-btn__icon">💬</span><span>連絡済（再コピー）</span>';
          showToast('LINE文をコピーしました📋', 'ok');
        } else {
          showToast('コピーに失敗しました', 'danger');
        }
      });
    });

    document.getElementById('btn-pay').addEventListener('click', function(){
      lesson.paymentStatus = lesson.paymentStatus === '回収済' ? '未回収' : '回収済';
      persist();
      renderShell();
      var btn = document.getElementById('btn-pay');
      var isDone = lesson.paymentStatus === '回収済';
      btn.classList.toggle('is-done', isDone);
      btn.innerHTML = '<span class="action-btn__icon">' + (isDone?'✅':'💴') + '</span><span>' + (isDone?'回収済み':'未回収 → タップで回収') + '</span>';
      showToast(isDone ? '入金済みにしました' : '未回収に戻しました', 'navy');
    });

    var micBtn = document.getElementById('mic-btn');
    var recordingHint = document.getElementById('recording-hint');
    var notesTextarea = document.getElementById('notes-textarea');
    var recognizing = false;
    var recognizer = createRecognizer(function(text){
      notesTextarea.value = (notesTextarea.value ? notesTextarea.value + ' ' : '') + text;
    });

    if(!recognizer){
      micBtn.outerHTML = '<span class="mic-unsupported">🎤 音声入力非対応</span>';
    } else {
      recognizer.onend = function(){ recognizing = false; micBtn.classList.remove('is-recording'); recordingHint.style.display = 'none'; };
      recognizer.onerror = function(){ recognizing = false; micBtn.classList.remove('is-recording'); recordingHint.style.display = 'none'; };
      micBtn.addEventListener('click', function(){
        if(recognizing){
          recognizer.stop();
          recognizing = false;
          micBtn.classList.remove('is-recording');
          recordingHint.style.display = 'none';
        } else {
          try{
            recognizer.start();
            recognizing = true;
            micBtn.classList.add('is-recording');
            recordingHint.style.display = '';
          }catch(e){}
        }
      });
    }

    document.getElementById('btn-delete').addEventListener('click', function(){
      if(window.confirm('この予定を削除しますか？')){
        lessons = lessons.filter(function(l){ return l.id !== lesson.id; });
        persist();
        closeModal();
        renderShell();
        showToast('予定を削除しました', 'navy');
      }
    });

    document.getElementById('btn-save-lesson').addEventListener('click', function(){
      lesson.fee = currentFee();
      lesson.splitCount = currentSplit();
      lesson.tags = currentTags();
      lesson.notes = notesTextarea.value;
      lesson.homework = document.getElementById('homework-textarea').value;
      persist();
      renderShell();
      closeModal();
      showToast('カルテを保存しました', 'ok');
    });
  }

  function attachAddSheetListeners(){
    var overlay = document.getElementById('add-overlay');
    var selectedType = 'personal';

    overlay.addEventListener('click', function(e){
      var actionEl = e.target.closest('[data-action]');
      if(!actionEl) return;
      if(actionEl.dataset.action === 'close-sheet'){ closeModal(); }
      else if(actionEl.dataset.action === 'open-classroom-master'){ openClassroomMasterModal(); }
    });

    var typeGrid = document.getElementById('type-select-grid');
    var splitRow = document.getElementById('add-split-row');
    var classroomBlock = document.getElementById('classroom-select-block');
    var studentSelectBlock = document.getElementById('student-select-block');
    var studentLabel = document.getElementById('add-student-label');
    var studentInputEl = document.getElementById('add-student');
    var submitBtnRef = document.getElementById('btn-create-lesson');
    var allSelCls = TYPE_ORDER.map(function(k){ return 'sel-' + k; });

    typeGrid.addEventListener('click', function(e){
      var btn = e.target.closest('.type-select-btn');
      if(!btn) return;
      Array.prototype.forEach.call(typeGrid.querySelectorAll('.type-select-btn'), function(el){
        el.classList.remove.apply(el.classList, ['is-selected'].concat(allSelCls));
      });
      btn.classList.add('is-selected', btn.dataset.selcls);
      selectedType = btn.dataset.type;
      splitRow.style.display = (selectedType === 'rental') ? '' : 'none';

      if(selectedType === 'kyoshitsu'){
        classroomBlock.style.display = '';
        studentSelectBlock.style.display = 'none';
        studentLabel.textContent = '教室名 / レッスン内容';
        studentInputEl.placeholder = '例：〇〇スケート教室 / 大人クラス初級';
      } else {
        classroomBlock.style.display = 'none';
        studentSelectBlock.style.display = '';
        studentLabel.textContent = '生徒名 / グループ名';
        studentInputEl.placeholder = '例：佐藤 ひなた';
      }
    });

    var rinkRow = document.getElementById('rink-row');
    rinkRow.addEventListener('click', function(e){
      var btn = e.target.closest('.rink-btn');
      if(!btn) return;
      Array.prototype.forEach.call(rinkRow.querySelectorAll('.rink-btn'), function(el){ el.classList.remove('is-selected'); });
      btn.classList.add('is-selected');
    });

    var studentSelect = document.getElementById('add-student-select');
    if(studentSelect) {
      studentSelect.addEventListener('change', function(){
        var val = studentSelect.value;
        if(!val) return;
        var st = studentMaster.find(function(s){ return s.id === val; });
        if(!st) return;
        studentInputEl.value = st.name;
        if(st.rink) {
          Array.prototype.forEach.call(rinkRow.querySelectorAll('.rink-btn'), function(el){
            el.classList.toggle('is-selected', el.dataset.rink === st.rink);
          });
        }
        submitBtnRef.disabled = false;
      });
    }

    var classroomSelect = document.getElementById('add-classroom-select');
    classroomSelect.addEventListener('change', function(){
      var val = classroomSelect.value;
      if(!val) return;
      var c = classroomMaster.find(function(x){ return x.id === val; });
      if(!c) return;
      studentInputEl.value = c.name;
      document.getElementById('add-start').value = c.start;
      document.getElementById('add-end').value = c.end;
      Array.prototype.forEach.call(rinkRow.querySelectorAll('.rink-btn'), function(el){
        el.classList.toggle('is-selected', el.dataset.rink === c.rink);
      });
      submitBtnRef.disabled = studentInputEl.value.trim().length === 0;
    });

    var addSplit = document.getElementById('add-split');
    document.getElementById('add-split-minus').addEventListener('click', function(){ addSplit.value = Math.max(1,(Number(addSplit.value)||1)-1); });
    document.getElementById('add-split-plus').addEventListener('click', function(){ addSplit.value = (Number(addSplit.value)||1)+1; });

    studentInputEl.addEventListener('input', function(){ submitBtnRef.disabled = studentInputEl.value.trim().length === 0; });

    submitBtnRef.addEventListener('click', function(){
      if(studentInputEl.value.trim().length === 0) return;
      var rinkBtn = rinkRow.querySelector('.rink-btn.is-selected');

        id: uid(),
        date: document.getElementById('add-date').value || todayStr(),
        start: document.getElementById('add-start').value || '09:00',
        end: document.getElementById('add-end').value || '09:30',

        rink: rinkBtn ? rinkBtn.dataset.rink : RINKS[0],
        fee: Number(document.getElementById('add-fee').value) || 0,
        splitCount: Math.max(1, Number(addSplit.value)||1),

        paymentStatus: '未回収',

        notes: '',
        homework: '',
        createdAt: Date.now()

      lessons.push(newLesson);
      persist();
      selectedDate = newLesson.date;
      closeModal();
      renderShell();
      showToast('予定を追加しました', 'ok');
    });

    html += '<div class="sheet__header"><div class="sheet__header-title">パスワード設定</div><button class="sheet__close tappable" data-action="close-settings">✕</button></div>';

    html += '<div class="field-label">暗証番号（空欄にすると解除されます）</div>';
    html += '<input type="password" id="set-pass-input" class="text-input" placeholder="例：1234" value="' + esc(appSettings.password||'') + '">';
    html += '<button id="btn-save-pass" class="sheet__submit tappable" style="margin-top:16px;">設定を保存</button>';
    html += '</div></div></div>';
    classroomOverlayRoot.innerHTML = html;

    document.getElementById('btn-save-pass').addEventListener('click', function(){
      appSettings.password = document.getElementById('set-pass-input').value.trim();
      persistSettings();
      showToast('パスワードを設定しました', 'ok');
      openSettingsModal();
    });
  }

  // --- 生徒マスタ管理 ---
  function renderStudentMasterModal(editId) {
    var editing = editId ? studentMaster.find(function(s){ return s.id === editId; }) : null;
    var html = '<div class="sheet-overlay" id="student-master-overlay">';
    html += '<div class="sheet-backdrop" data-action="open-settings-modal"></div>';
    html += '<div class="sheet">';
    html += '<div class="sheet__header"><div class="sheet__header-title">生徒マスタを管理</div><button class="sheet__close tappable" data-action="open-settings-modal">✕</button></div>';
    html += '<div class="sheet__body">';

    html += '<div><div class="field-label">登録済みの生徒</div>';
    if(studentMaster.length === 0){
      html += '<div class="classroom-empty">まだ登録がありません</div>';
    } else {
      html += '<div class="classroom-list">';
      studentMaster.forEach(function(s){
        html += '<div class="classroom-row">';
        html += '<div class="classroom-row__body"><div class="classroom-row__name">' + esc(s.name) + '</div><div class="classroom-row__meta">' + esc(s.rink || 'リンク指定なし') + '</div></div>';
        html += '<div class="classroom-row__actions">';
        html += '<button class="icon-btn tappable" data-action="edit-student-row" data-id="' + s.id + '">✏️</button>';
        html += '<button class="icon-btn icon-btn--danger tappable" data-action="delete-student-row" data-id="' + s.id + '">🗑</button>';
        html += '</div></div>';
      });
      html += '</div>';
    }
    html += '</div>';

    html += '<hr style="border:none;border-top:1px solid #eee;margin:16px 0;">';
    html += '<div><div class="classroom-form-title">' + (editing ? '生徒情報を編集' : '新しい生徒を登録') + '</div>';
    html += '<div style="margin-top:10px;"><div class="field-label">生徒氏名</div><input type="text" id="sm-name" class="text-input" placeholder="例：山田 太郎" value="' + (editing ? esc(editing.name) : '') + '"></div>';
    html += '<div style="margin-top:10px;"><div class="field-label">メインリンク</div><input type="text" id="sm-rink" class="text-input" placeholder="例：東伏見" value="' + (editing ? esc(editing.rink||'') : '') + '"></div>';
    html += '<button class="sheet__submit tappable" id="btn-save-student" style="margin-top:16px;">' + (editing ? '更新する' : '登録する') + '</button>';
    html += '</div>';

    html += '</div></div></div>';
    classroomOverlayRoot.innerHTML = html;

    var overlay = document.getElementById('student-master-overlay');
    overlay.addEventListener('click', function(e){
      var actionEl = e.target.closest('[data-action]');
      if(!actionEl) return;
      var act = actionEl.dataset.action;
      if(act === 'open-settings-modal') openSettingsModal();
      else if(act === 'edit-student-row') renderStudentMasterModal(actionEl.dataset.id);
      else if(act === 'delete-student-row') {
        if(confirm('この生徒を削除しますか？')){
          studentMaster = studentMaster.filter(function(s){ return s.id !== actionEl.dataset.id; });
          persistStudents();
          renderStudentMasterModal(null);
          showToast('削除しました', 'navy');
        }
      }
    });

    document.getElementById('btn-save-student').addEventListener('click', function(){
      var name = document.getElementById('sm-name').value.trim();
      var rink = document.getElementById('sm-rink').value.trim();
      if(!name) { showToast('氏名を入力してください', 'danger'); return; }

      if(editing) {
        editing.name = name;
        editing.rink = rink;
      } else {
        studentMaster.push({ id: uid(), name: name, rink: rink });
      }
      persistStudents();
      renderStudentMasterModal(null);
      showToast('生徒情報を保存しました', 'ok');
    });
  }

  // --- 教室マスタ管理モーダル ---
  function openClassroomMasterModal(){ renderClassroomMasterModal(null); }
  function closeClassroomMasterModal(){
    classroomOverlayRoot.innerHTML = '';
    refreshClassroomSelect();
  }

  function renderClassroomMasterModal(editId){
    var editing = editId ? classroomMaster.find(function(c){ return c.id === editId; }) : null;
    var html = '<div class="sheet-overlay" id="classroom-master-overlay">';
    html += '<div class="sheet-backdrop" data-action="close-classroom-master"></div>';
    html += '<div class="sheet">';
    html += '<div class="sheet__grabber-row"><div class="sheet__grabber"></div></div>';
    html += '<div class="sheet__header"><div class="sheet__header-text"><div class="sheet__header-title">教室マスタを管理</div><div class="sheet__header-sub">名称・時間・場所を登録しておくと予定作成が早くなります</div></div><button class="sheet__close tappable" data-action="close-classroom-master">✕</button></div>';
    html += '<div class="sheet__body">';

    html += '<div><div class="field-label">登録済みの教室</div>';
    if(classroomMaster.length === 0){
      html += '<div class="classroom-empty">まだ登録がありません</div>';
    } else {
      html += '<div class="classroom-list">';
      classroomMaster.forEach(function(c){
        html += '<div class="classroom-row">';
        html += '<div class="classroom-row__body"><div class="classroom-row__name">' + esc(c.name) + '</div><div class="classroom-row__meta mono">' + esc(c.start) + '〜' + esc(c.end) + ' ・ ' + esc(c.rink) + '</div></div>';
        html += '<div class="classroom-row__actions">';
        html += '<button class="icon-btn tappable" data-action="edit-classroom-row" data-id="' + c.id + '">✏️</button>';
        html += '<button class="icon-btn icon-btn--danger tappable" data-action="delete-classroom-row" data-id="' + c.id + '">🗑</button>';
        html += '</div></div>';
      });
      html += '</div>';
    }
    html += '</div>';

    html += '<div>';
    html += '<div class="classroom-form-title">' + (editing ? '教室を編集' : '新しい教室を登録') + (editing ? '<span class="classroom-cancel-edit tappable" data-action="cancel-edit-classroom">キャンセル</span>' : '') + '</div>';
    html += '<div style="margin-top:10px;"><div class="field-label">教室名</div><input type="text" id="cm-name" class="text-input" placeholder="例：大人スケート教室" value="' + (editing ? esc(editing.name) : '') + '"></div>';
    html += '<div class="grid-2" style="margin-top:12px;">';
    html += '<div><div class="field-label">開始</div><input type="time" id="cm-start" class="date-input" value="' + (editing ? esc(editing.start) : '18:00') + '"></div>';
    html += '<div><div class="field-label">終了</div><input type="time" id="cm-end" class="date-input" value="' + (editing ? esc(editing.end) : '19:00') + '"></div>';
    html += '</div>';

    html += '<div style="margin-top:12px;"><div class="field-label">リンク</div><div class="rink-row" id="cm-rink-row">';
    RINKS.forEach(function(r, idx){
      var isSel = editing ? (editing.rink === r) : (idx === 0);
      html += '<button class="rink-btn tappable min-tap' + (isSel?' is-selected':'') + '" data-rink="' + esc(r) + '">' + esc(r) + '</button>';
    });
    html += '</div></div>';
    html += '</div>';

    html += '</div>'; // body
    html += '<div class="sheet__footer"><button class="sheet__submit tappable" id="btn-save-classroom">' + (editing ? 'この内容で更新する' : 'この内容で登録する') + '</button></div>';
    html += '</div></div>';
    classroomOverlayRoot.innerHTML = html;

    attachClassroomMasterListeners(editId);
  }

  function attachClassroomMasterListeners(editId){
    var overlay = document.getElementById('classroom-master-overlay');
    overlay.addEventListener('click', function(e){
      var actionEl = e.target.closest('[data-action]');
      if(!actionEl) return;
      var action = actionEl.dataset.action;
      if(action === 'close-classroom-master'){
        closeClassroomMasterModal();
      } else if(action === 'edit-classroom-row'){
        renderClassroomMasterModal(actionEl.dataset.id);
      } else if(action === 'cancel-edit-classroom'){
        renderClassroomMasterModal(null);
      } else if(action === 'delete-classroom-row'){
        if(window.confirm('この教室をマスタから削除しますか？（過去の予定データは残ります）')){
          classroomMaster = classroomMaster.filter(function(c){ return c.id !== actionEl.dataset.id; });
          persistClassrooms();
          renderClassroomMasterModal(null);
          refreshClassroomSelect();
          showToast('教室を削除しました', 'navy');
        }
      }
    });

    var cmRinkRow = document.getElementById('cm-rink-row');
    cmRinkRow.addEventListener('click', function(e){
      var btn = e.target.closest('.rink-btn');
      if(!btn) return;
      Array.prototype.forEach.call(cmRinkRow.querySelectorAll('.rink-btn'), function(el){ el.classList.remove('is-selected'); });
      btn.classList.add('is-selected');
    });

    document.getElementById('btn-save-classroom').addEventListener('click', function(){
      var nameInput = document.getElementById('cm-name');
      var name = nameInput.value.trim();
      if(!name){ showToast('教室名を入力してください', 'danger'); return; }
      var start = document.getElementById('cm-start').value || '18:00';
      var end = document.getElementById('cm-end').value || '19:00';
      var rinkBtn = cmRinkRow.querySelector('.rink-btn.is-selected');
      var rink = rinkBtn ? rinkBtn.dataset.rink : RINKS[0];

      if(editId){
        var target = classroomMaster.find(function(c){ return c.id === editId; });
        if(target){ target.name = name; target.start = start; target.end = end; target.rink = rink; }
      } else {
        classroomMaster.push({ id: uid(), name: name, start: start, end: end, rink: rink });
      }

      persistClassrooms();
      refreshClassroomSelect();
      renderClassroomMasterModal(null);
      showToast(editId ? '教室を更新しました' : '教室を登録しました', 'ok');
    });
  }

  // --- バックアップ・復元処理 ---
  function exportBackupData() {
    var backupObj = {
      version: 1,
      timestamp: Date.now(),
      lessons: lessons,
      classroomMaster: classroomMaster,
      studentMaster: studentMaster,
      appSettings: appSettings
    };
    var jsonStr = JSON.stringify(backupObj, null, 2);
    var blob = new Blob([jsonStr], { type: 'application/json' });
    var link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = 'torepeta_backup_' + todayStr() + '.json';
    link.click();
    showToast('バックアップを出力しました', 'ok');
  }

  function importBackupData(e) {
    var file = e.target.files[0];
    if(!file) return;
    var reader = new FileReader();
    reader.onload = function(evt) {
      try {
        var data = JSON.parse(evt.target.result);
        if(data.lessons) lessons = data.lessons;
        if(data.classroomMaster) classroomMaster = data.classroomMaster;
        if(data.studentMaster) studentMaster = data.studentMaster;
        if(data.appSettings) appSettings = data.appSettings;

        persist();
        persistClassrooms();
        persistStudents();
        persistSettings();

        classroomOverlayRoot.innerHTML = '';
        renderShell();
        showToast('データを復元しました', 'ok');
      } catch(err) {
        showToast('ファイルの読み込みに失敗しました', 'danger');
      }
    };
    reader.readAsText(file);
  }

  // --- ルートクリックイベントディスパッチ ---
  rootEl.addEventListener('click', function(e){
    var el = e.target.closest('[data-action]');
    if(!el) return;
    var action = el.dataset.action;
    if(action === 'select-date') selectDate(el.dataset.date);
    else if(action === 'switch-tab') switchTab(el.dataset.tab);
    else if(action === 'open-lesson') openLessonModal(el.dataset.id);
    else if(action === 'quick-line') quickLine(el.dataset.id);
    else if(action === 'toggle-payment') togglePaymentFromFinance(el.dataset.id);
    else if(action === 'open-add') openAddSheet();
    else if(action === 'export-csv') exportCsv();
    else if(action === 'year-prev') changeFinanceYear(-1);
    else if(action === 'year-next') changeFinanceYear(1);
    else if(action === 'set-view') setViewMode(el.dataset.view);
    else if(action === 'cal-prev-month') calPrevMonth();
    else if(action === 'cal-next-month') calNextMonth();
    else if(action === 'open-settings-modal') openSettingsModal();
    else if(action === 'open-classroom-master') openClassroomMasterModal();
  });

})();</script>
