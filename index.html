<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>トレペタ - for Figure Skating Coaches -</title>
  <style>
    :root {
      --primary: #1e3a8a;
      --primary-light: #3b82f6;
      --accent: #06b6d4;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --text-sub: #64748b;
      --border: #e2e8f0;
      --shadow: 0 4px 12px rgba(0,0,0,0.05);
      --radius: 12px;
      --safe-area-bottom: env(safe-area-inset-bottom, 0px);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg); color: var(--text); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

    /* ロック画面 */
    #lock-screen {
      position: fixed; inset: 0; background: #0f172a; z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: #fff; padding: 20px;
    }
    .lock-icon { font-size: 48px; margin-bottom: 16px; }
    .lock-title { font-size: 20px; font-weight: bold; margin-bottom: 8px; }
    .lock-sub { font-size: 13px; color: #94a3b8; margin-bottom: 24px; text-align: center; }
    .pin-input {
      font-size: 24px; letter-spacing: 12px; text-align: center; padding: 12px;
      width: 200px; border-radius: 8px; border: 2px solid #334155; background: #1e293b; color: #fff; outline: none; margin-bottom: 16px;
    }
    .lock-btn {
      width: 200px; padding: 12px; background: var(--primary-light); color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer;
    }

    /* ヘッダー・ナビゲーション */
    .app-header { background: #fff; border-bottom: 1px solid var(--border); padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; }
    .app-title { font-weight: 800; font-size: 18px; color: var(--primary); display: flex; align-items: center; gap: 6px; }
    .header-actions { display: flex; gap: 8px; }
    .icon-btn { background: none; border: none; font-size: 18px; cursor: pointer; padding: 6px; border-radius: 6px; }
    .icon-btn:hover { background: #f1f5f9; }

    .main-scroll { flex: 1; overflow-y: auto; padding: 12px 16px 80px 16px; }

    .bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0; background: #fff; border-top: 1px solid var(--border);
      display: flex; padding-bottom: var(--safe-area-bottom); z-index: 100;
    }
    .nav-btn { flex: 1; border: none; background: none; padding: 8px 0; display: flex; flex-direction: column; align-items: center; gap: 2px; color: var(--text-sub); cursor: pointer; }
    .nav-btn.is-active { color: var(--primary-light); font-weight: bold; }
    .nav-btn__icon { font-size: 18px; }
    .nav-btn__label { font-size: 10px; }

    /* FAB (追加ボタン) */
    .fab {
      position: fixed; right: 20px; bottom: calc(65px + var(--safe-area-bottom)); width: 56px; height: 56px;
      border-radius: 28px; background: var(--primary-light); color: #fff; border: none; font-size: 28px;
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4); display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 90;
    }

    /* ビュー切替 & カレンダー */
    .view-switch { display: flex; background: #e2e8f0; border-radius: 8px; padding: 2px; margin-bottom: 12px; }
    .view-switch button { flex: 1; border: none; padding: 6px; font-size: 12px; font-weight: bold; border-radius: 6px; background: none; color: var(--text-sub); cursor: pointer; }
    .view-switch button.is-active { background: #fff; color: var(--text); shadow: var(--shadow); }

    .date-strip { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 12px; scrollbar-width: none; }
    .date-strip::-webkit-scrollbar { display: none; }
    .date-chip { flex: 0 0 auto; min-width: 54px; padding: 8px 4px; border-radius: 10px; background: #fff; border: 1px solid var(--border); text-align: center; cursor: pointer; }
    .date-chip.is-selected { background: var(--primary); color: #fff; border-color: var(--primary); }
    .date-chip__day { font-size: 10px; opacity: 0.8; }
    .date-chip__num { font-size: 16px; font-weight: bold; }

    /* 月カレンダー */
    .cal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-weight: bold; }
    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; font-size: 12px; margin-bottom: 16px; }
    .cal-day-head { font-weight: bold; color: var(--text-sub); padding: 4px 0; }
    .cal-cell { background: #fff; border-radius: 6px; min-height: 48px; padding: 4px 2px; border: 1px solid var(--border); cursor: pointer; }
    .cal-cell.is-selected { border: 2px solid var(--primary-light); }
    .cal-cell__num { font-size: 11px; margin-bottom: 2px; }
    .cal-cell__dots { display: flex; justify-content: center; gap: 2px; flex-wrap: wrap; }
    .dot { width: 5px; height: 5px; border-radius: 50%; }

    /* レッスンカード */
    .lesson-card { background: var(--card-bg); border-radius: var(--radius); padding: 12px; margin-bottom: 10px; border: 1px solid var(--border); box-shadow: var(--shadow); }
    .lesson-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 6px; }
    .type-badge { padding: 2px 8px; border-radius: 12px; font-size: 11px; font-weight: bold; color: #fff; }
    .type-badge.personal { background: #2563eb; }
    .type-badge.rental { background: #7c3aed; }
    .type-badge.kyoshitsu { background: #059669; }
    .type-badge.振替 { background: #d97706; }
    .student-name { font-weight: bold; font-size: 16px; margin-bottom: 2px; display: flex; align-items: center; gap: 6px; }
    .student-level { font-size: 11px; background: #e2e8f0; color: var(--text-sub); padding: 1px 6px; border-radius: 4px; font-weight: normal; }
    .lesson-time { font-size: 12px; color: var(--text-sub); }
    .card-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--border); font-size: 12px; }
    .status-btn { padding: 4px 8px; border-radius: 6px; border: none; font-size: 11px; cursor: pointer; font-weight: bold; }
    .status-btn.done { background: #dcfce7; color: #166534; }
    .status-btn.pending { background: #fee2e2; color: #991b1b; }

    /* 収支ビュー */
    .finance-summary { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
    .summary-card { background: #fff; padding: 12px; border-radius: var(--radius); border: 1px solid var(--border); }
    .summary-card__title { font-size: 11px; color: var(--text-sub); }
    .summary-card__val { font-size: 18px; font-weight: bold; color: var(--primary); margin-top: 4px; }

    /* モーダル / シート */
    .sheet-overlay { position: fixed; inset: 0; z-index: 1000; display: flex; flex-direction: column; justify-content: flex-end; }
    .sheet-backdrop { position: absolute; inset: 0; background: rgba(0,0,0,0.5); }
    .sheet { position: relative; background: #fff; border-radius: 16px 16px 0 0; max-height: 90vh; display: flex; flex-direction: column; overflow: hidden; animation: slideUp 0.2s ease-out; }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    .sheet__grabber-row { display: flex; justify-content: center; padding: 8px; }
    .sheet__grabber { width: 36px; height: 4px; background: #cbd5e1; border-radius: 2px; }
    .sheet__header { padding: 8px 16px 12px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); }
    .sheet__header-title { font-weight: bold; font-size: 16px; }
    .sheet__close { background: none; border: none; font-size: 18px; cursor: pointer; color: var(--text-sub); }
    .sheet__body { padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }
    .sheet__footer { padding: 12px 16px; border-top: 1px solid var(--border); background: #fff; margin-top: auto; }
    .sheet__submit { width: 100%; padding: 12px; background: var(--primary-light); color: #fff; border: none; border-radius: 8px; font-weight: bold; font-size: 15px; cursor: pointer; }

    /* フォームパーツ */
    .field-label { font-size: 12px; font-weight: bold; color: var(--text-sub); margin-bottom: 4px; }
    .text-input, .date-input, .select-input, .notes-textarea { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; outline: none; }
    .notes-textarea { min-height: 80px; resize: vertical; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }

    .tag-wrap { display: flex; flex-wrap: wrap; gap: 6px; }
    .tag-chip { border: 1px solid var(--border); background: #fff; padding: 4px 10px; border-radius: 16px; font-size: 12px; cursor: pointer; }
    .tag-chip.is-selected { background: var(--primary); color: white; border-color: var(--primary); }

    .type-select-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
    .type-select-btn { border: 1px solid var(--border); background: #fff; padding: 8px 4px; border-radius: 8px; text-align: center; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .type-select-btn.is-selected { border-color: var(--primary-light); background: #eff6ff; }

    .rink-row { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; }
    .rink-btn { flex: 0 0 auto; padding: 6px 12px; border-radius: 16px; border: 1px solid var(--border); background: #fff; font-size: 12px; cursor: pointer; }
    .rink-btn.is-selected { background: var(--accent); color: white; border-color: var(--accent); }

    .action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .action-btn { padding: 10px; border-radius: 8px; border: 1px solid var(--border); background: #fff; font-size: 12px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; }
    .action-btn.is-done { background: #f1f5f9; color: var(--text-sub); }

    .advice-box { background: #fffbe6; border: 1px solid #ffe58f; padding: 10px; border-radius: 8px; font-size: 12px; }
    .advice-box__title { font-weight: bold; color: #d48806; margin-bottom: 4px; display: flex; gap: 4px; }

    .delete-link { color: #ef4444; background: none; border: none; font-size: 12px; text-align: center; padding: 8px; cursor: pointer; width: 100%; margin-top: 4px; }

    /* トースト通知 */
    #toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #1e293b; color: #fff; padding: 8px 16px; border-radius: 20px; font-size: 13px; z-index: 10000; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
    #toast.show { opacity: 1; }
  </style>
</head>
<body>

  <!-- パスワード保護用ロック画面 -->
  <div id="lock-screen" style="display:none;">
    <div class="lock-icon">🔒</div>
    <div class="lock-title">トレペタ</div>
    <div class="lock-sub">パスコードを入力してください</div>
    <input type="password" id="pin-input" class="pin-input" maxlength="4" pattern="\d*" inputmode="numeric">
    <button class="lock-btn" id="btn-unlock">ロック解除</button>
  </div>

  <div id="app-root"></div>
  <div id="overlay-root"></div>
  <div id="classroom-overlay-root"></div>
  <div id="toast"></div>

<script>
(function(){
  // --- アプリ基本データ構成 ---
  var LOCK_PIN = ""; // 空文字ならパスワード保護無効。例: "1234" で4桁ロック有効化

  var LESSON_TYPES = {
    personal: { label: '個人レッスン', short: '個人', icon: '👤', cls: 'personal', shape: 'square' },
    rental: { label: '貸切・枠貸し', short: '貸切', icon: '⛸️', cls: 'rental', shape: 'circle' },
    kyoshitsu: { label: '教室・スクール', short: '教室', icon: '🏫', cls: 'kyoshitsu', shape: 'triangle' },
    furikae: { label: '振替レッスン', short: '振替', icon: '🔄', cls: '振替', shape: 'diamond' }
  };
  var TYPE_ORDER = ['personal', 'rental', 'kyoshitsu', 'furikae'];

  var RINKS = ['明治神宮', 'ダイドードリンコ', '横浜銀行', 'アクアリンク', '新横浜', 'その他'];

  var LEVEL_SYSTEMS = {
    none: { label: '未設定', levels: [] },
    jsf: { label: '日スケ連テスト級', levels: ['初級', '1級', '2級', '3級', '4級', '5級', '6級', '7級', '8級'] },
    isi: { label: 'ISIレベル', levels: ['Pre-Alpha', 'Alpha', 'Beta', 'Gamma', 'Delta', 'Freestyle 1', 'Freestyle 2', 'Freestyle 3', 'Freestyle 4', 'Freestyle 5', 'Freestyle 6+'] },
    category: { label: '年齢/選手区分', levels: ['無級・初心者', 'ノービスC', 'ノービスB', 'ノービスA', 'ジュニア', 'シニア', 'マスターズ/大人'] }
  };

  var TAG_PRESETS = ['スピン', 'ジャンプ', 'ステップ/TR', 'スケーティング', '曲かけ', '表現・表現力', '靴・研磨調整', 'コンディション'];

  // --- ローカルストレージ管理 ---
  var STORAGE_KEY = 'trepeta_lessons_v2';
  var CLASSROOM_KEY = 'trepeta_classrooms_v1';
  var STUDENTS_KEY = 'trepeta_students_v1';

  var lessons = loadLessons();
  var classroomMaster = loadClassrooms();
  var studentMaster = loadStudents();

  function loadLessons(){
    try {
      var d = localStorage.getItem(STORAGE_KEY);
      return d ? JSON.parse(d) : [];
    } catch(e){ return []; }
  }
  function persist(){
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(lessons)); } catch(e){}
  }

  function loadClassrooms(){
    try {
      var d = localStorage.getItem(CLASSROOM_KEY);
      return d ? JSON.parse(d) : [];
    } catch(e){ return []; }
  }
  function persistClassrooms(){
    try { localStorage.setItem(CLASSROOM_KEY, JSON.stringify(classroomMaster)); } catch(e){}
  }

  function loadStudents(){
    try {
      var d = localStorage.getItem(STUDENTS_KEY);
      return d ? JSON.parse(d) : {};
    } catch(e){ return {}; }
  }
  function persistStudents(){
    try { localStorage.setItem(STUDENTS_KEY, JSON.stringify(studentMaster)); } catch(e){}
  }

  // --- アプリ状態 ---
  var rootEl = document.getElementById('app-root');
  var overlayRoot = document.getElementById('overlay-root');
  var classroomOverlayRoot = document.getElementById('classroom-overlay-root');

  var currentTab = 'schedule'; // schedule | finance
  var viewMode = 'day'; // day | month
  var selectedDate = todayStr();
  var calYear = new Date().getFullYear();
  var calMonth = new Date().getMonth();
  var financeYear = new Date().getFullYear();

  // ユーティリティ
  function todayStr(){
    var d = new Date();
    return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate());
  }
  function pad(n){ return n < 10 ? '0' + n : '' + n; }
  function uid(){ return Date.now().toString(36) + Math.random().toString(36).substr(2, 5); }
  function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function yen(v){ return '¥' + Number(v||0).toLocaleString(); }
  function fmtDateJp(dateStr){
    var d = new Date(dateStr + 'T00:00:00');
    var w = ['日','月','火','水','木','金','土'][d.getDay()];
    return (d.getMonth()+1) + '月' + d.getDate() + '日(' + w + ')';
  }

  function showToast(msg, type){
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'show';
    setTimeout(function(){ t.className = ''; }, 2500);
  }

  function copyToClipboard(text){
    if(navigator.clipboard && navigator.clipboard.writeText){
      return navigator.clipboard.writeText(text).then(function(){ return true; }).catch(function(){ return false; });
    }
    var ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    var ok = document.execCommand('copy');
    document.body.removeChild(ta);
    return Promise.resolve(ok);
  }

  function buildLineMessage(l){
    var msg = "【レッスン連絡】\n";
    msg += "日時: " + fmtDateJp(l.date) + " " + l.start + "〜" + l.end + "\n";
    msg += "場所: " + l.rink + "\n";
    msg += "料金: " + yen(l.fee);
    if(l.type === 'rental' && l.splitCount > 1){
      msg += " (お一人様: " + yen(Math.ceil(l.fee / l.splitCount)) + ")";
    }
    if(l.homework){
      msg += "\n\n【前回からの宿題・アドバイス】\n" + l.homework;
    }
    msg += "\n\nよろしくお願いいたします！";
    return msg;
  }

  // --- レンダリング処理 ---
  function renderHeader(){
    var html = '<header class="app-header">';
    html += '<div class="app-title">⛸️ トレペタ</div>';
    html += '<div class="header-actions">';
    if(LOCK_PIN){
      html += '<button class="icon-btn" id="btn-lock-now" title="画面をロック">🔒</button>';
    }
    html += '</div></header>';
    return html;
  }

  function renderScheduleView(){
    var html = '<div class="view-switch">';
    html += '<button class="' + (viewMode==='day'?'is-active':'') + '" data-action="set-view" data-view="day">日別スケジュール</button>';
    html += '<button class="' + (viewMode==='month'?'is-active':'') + '" data-action="set-view" data-view="month">月表示</button>';
    html += '</div>';

    if(viewMode === 'day'){
      html += renderDateStrip();
      html += renderDayLessons();
    } else {
      html += renderMonthCalendar();
    }
    return html;
  }

  function renderDateStrip(){
    var html = '<div class="date-strip" id="date-strip">';
    var curr = new Date(selectedDate + 'T00:00:00');
    for(var i=-3; i<=7; i++){
      var d = new Date(curr);
      d.setDate(d.getDate() + i);
      var ds = d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate());
      var isSel = ds === selectedDate;
      var w = ['日','月','火','水','木','金','土'][d.getDay()];
      html += '<div class="date-chip' + (isSel?' is-selected':'') + '" data-action="select-date" data-date="' + ds + '">';
      html += '<div class="date-chip__day">' + w + '</div>';
      html += '<div class="date-chip__num">' + d.getDate() + '</div>';
      html += '</div>';
    }
    html += '</div>';
    return html;
  }

  function renderDayLessons(){
    var dayLessons = lessons.filter(function(l){ return l.date === selectedDate; });
    dayLessons.sort(function(a,b){ return a.start.localeCompare(b.start); });

    var html = '<div style="margin-bottom:8px;font-weight:bold;font-size:14px;">' + fmtDateJp(selectedDate) + ' の予定 (' + dayLessons.length + '件)</div>';
    if(dayLessons.length === 0){
      return html + '<div style="text-align:center;padding:40px;color:var(--text-sub);font-size:13px;">予定はありません。右下の「＋」から追加できます。</div>';
    }

    dayLessons.forEach(function(l){
      var t = LESSON_TYPES[l.type] || LESSON_TYPES.personal;
      var stMaster = studentMaster[l.student] || {};
      var levelBadge = stMaster.level ? '<span class="student-level">' + esc(stMaster.level) + '</span>' : '';

      html += '<div class="lesson-card tappable" data-action="open-lesson" data-id="' + l.id + '">';
      html += '<div class="lesson-header">';
      html += '<div class="student-name"><span>' + esc(l.student) + '</span>' + levelBadge + '</div>';
      html += '<span class="type-badge ' + t.cls + '">' + t.short + '</span>';
      html += '</div>';
      html += '<div class="lesson-time">⏰ ' + esc(l.start) + ' 〜 ' + esc(l.end) + ' ・ 📍 ' + esc(l.rink) + '</div>';
      html += '<div class="card-footer">';
      html += '<div>料金: <b>' + yen(l.fee) + '</b></div>';
      html += '<button class="status-btn ' + (l.paymentStatus==='回収済'?'done':'pending') + '" data-action="toggle-payment" data-id="' + l.id + '">';
      html += (l.paymentStatus==='回収済'?'✅ 回収済':'💴 未回収');
      html += '</button>';
      html += '</div></div>';
    });
    return html;
  }

  function renderMonthCalendar(){
    var firstDay = new Date(calYear, calMonth, 1);
    var lastDay = new Date(calYear, calMonth + 1, 0);
    var startDayOfWeek = firstDay.getDay();
    var daysInMonth = lastDay.getDate();

    var html = '<div class="cal-header">';
    html += '<button class="icon-btn" data-action="cal-prev-month">◀</button>';
    html += '<div>' + calYear + '年 ' + (calMonth + 1) + '月</div>';
    html += '<button class="icon-btn" data-action="cal-next-month">▶</button>';
    html += '</div>';

    html += '<div class="cal-grid">';
    ['日','月','火','水','木','金','土'].forEach(function(h){ html += '<div class="cal-day-head">' + h + '</div>'; });

    for(var i=0; i<startDayOfWeek; i++){ html += '<div></div>'; }

    for(var day=1; day<=daysInMonth; day++){
      var ds = calYear + '-' + pad(calMonth+1) + '-' + pad(day);
      var isSel = ds === selectedDate;
      var dayLessons = lessons.filter(function(l){ return l.date === ds; });

      html += '<div class="cal-cell' + (isSel?' is-selected':'') + '" data-action="select-date" data-date="' + ds + '">';
      html += '<div class="cal-cell__num">' + day + '</div>';
      html += '<div class="cal-cell__dots">';
      dayLessons.forEach(function(l){
        var bg = l.type==='personal'?'#2563eb':l.type==='rental'?'#7c3aed':l.type==='kyoshitsu'?'#059669':'#d97706';
        html += '<div class="dot" style="background:'+bg+'"></div>';
      });
      html += '</div></div>';
    }
    html += '</div>';
    return html;
  }

  function renderFinanceView(){
    var rows = lessons.filter(function(l){ return l.date.indexOf(String(financeYear)) === 0; });
    var totalAll = rows.reduce(function(s,l){ return s + Number(l.fee||0); }, 0);

  function exportCsv(){
    var rows = lessons.filter(function(l){ return l.date.indexOf(String(financeYear))===0; });
    if(rows.length === 0){ showToast(financeYear + '年のデータがありません', 'danger'); return; }
    var header = ['日付','開始','終了','種別','生徒名/グループ名','リンク','料金','割り勘人数','入金状況','連絡状況','カルテタグ'];
    rows = rows.slice().sort(function(a,b){ return a.date.localeCompare(b.date) || a.start.localeCompare(b.start); });
    var lines = rows.map(function(l){
      return [ l.date, l.start, l.end, LESSON_TYPES[l.type].label, l.student, l.rink, l.fee, l.splitCount||1, l.paymentStatus, l.contactStatus, (l.tags||[]).join('/') ];
    });
    var totalAll = rows.reduce(function(s,l){ return s+Number(l.fee||0); },0);
    var totalPaid = rows.filter(function(l){ return l.paymentStatus==='回収済'; }).reduce(function(s,l){ return s+Number(l.fee||0); },0);
    lines.push([]);
    lines.push(['', '', '', '', '', '年間合計', totalAll, '', '回収済合計:' + totalPaid, '', '']);

    function escCsv(v){
      var s = String(v==null ? '' : v);
      return /[",\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s;
    }
    var csv = [header].concat(lines).map(function(row){ return row.map(escCsv).join(','); }).join('\r\n');
    var blob = new Blob(['\uFEFF' + csv], { type:'text/csv;charset=utf-8;' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'トレペタ_確定申告用_' + financeYear + '年.csv';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast(financeYear + '年分のCSVを出力しました', 'ok');
  }

  function createRecognizer(onFinalText){
    var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if(!SR) return null;
    var rec = new SR();
    rec.lang = 'ja-JP';
    rec.continuous = true;
    rec.interimResults = true;
    rec.onresult = function(e){
      var finalTxt = '';
      for(var i=e.resultIndex; i<e.results.length; i++){
        if(e.results[i].isFinal) finalTxt += e.results[i][0].transcript;
      }
      if(finalTxt) onFinalText(finalTxt);
    };
    return rec;
  }

  function findPrevAdvice(lesson){
    var candidates = lessons.filter(function(l){
      return l.student === lesson.student && l.id !== lesson.id && (l.homework || l.notes) &&
        (l.date + 'T' + (l.start||'00:00')) < (lesson.date + 'T' + (lesson.start||'00:00'));
    });
    candidates.sort(function(a,b){ return (b.date+'T'+b.start).localeCompare(a.date+'T'+a.start); });
    return candidates[0] || null;
  }

      if(!splitInput) return;
      var fee = Number(feeInput.value) || 0;
      var split = Math.max(1, Number(splitInput.value) || 1);
      if(split > 1){
        perPersonNote.style.display = '';

      } else {
        perPersonNote.style.display = 'none';

    if(splitInput) splitInput.addEventListener('input', recalcPerPerson);

    var tagWrap = document.getElementById('tag-wrap');

      var chip = e.target.closest('.tag-chip');
      if(!chip) return;
      chip.classList.toggle('is-selected');
    });

    function currentTags(){
      return Array.prototype.slice.call(tagWrap.querySelectorAll('.tag-chip.is-selected')).map(function(el){ return el.dataset.tag; });
    }
    function currentFee(){ return Number(feeInput.value) || 0; }
    function currentSplit(){ return splitInput ? Math.max(1, Number(splitInput.value)||1) : 1; }

    var opts = '<option value="">— 選択してください —</option>';
    classroomMaster.forEach(function(c){
      opts += '<option value="' + c.id + '">' + esc(c.name) + '（' + esc(c.start) + '〜' + esc(c.end) + ' ' + esc(c.rink) + '）</option>';
    });
    return opts;
  }

  // --- パスワード保護（ロック画面）制御 ---
  var lockScreen = document.getElementById('lock-screen');
  var pinInput = document.getElementById('pin-input');
  var btnUnlock = document.getElementById('btn-unlock');

  function checkLock(){
    if(LOCK_PIN && LOCK_PIN.length > 0){
      var isUnlocked = sessionStorage.getItem('trepeta_unlocked');
      if(!isUnlocked){
        lockScreen.style.display = 'flex';
      } else {
        lockScreen.style.display = 'none';
      }
    } else {
      lockScreen.style.display = 'none';
    }
  }

  if(btnUnlock){
    btnUnlock.addEventListener('click', function(){
      if(pinInput.value === LOCK_PIN){
        sessionStorage.setItem('trepeta_unlocked', 'true');
        lockScreen.style.display = 'none';
        pinInput.value = '';
        showToast('ロックを解除しました', 'ok');
      } else {
        showToast('パスコードが違います', 'danger');
        pinInput.value = '';
      }
    });
  }

  rootEl.addEventListener('click', function(e){
    var el = e.target.closest('[data-action]');
    if(!el) return;
    var action = el.dataset.action;
    if(action === 'select-date') selectDate(el.dataset.date);
    else if(action === 'switch-tab') switchTab(el.dataset.tab);
    else if(action === 'open-lesson') openLessonModal(el.dataset.id);
    else if(action === 'toggle-payment') togglePaymentFromFinance(el.dataset.id);
    else if(action === 'open-add') openAddSheet();
    else if(action === 'export-csv') exportCsv();
    else if(action === 'year-prev') changeFinanceYear(-1);
    else if(action === 'year-next') changeFinanceYear(1);
    else if(action === 'set-view') setViewMode(el.dataset.view);
    else if(action === 'cal-prev-month') calPrevMonth();
    else if(action === 'cal-next-month') calNextMonth();
  });

  document.addEventListener('click', function(e){
    if(e.target.id === 'btn-lock-now'){
      sessionStorage.removeItem('trepeta_unlocked');
      checkLock();
    }
  });

  // 初期化実行
  checkLock();
  renderShell();
})();
</script>
</body>
</html>
