<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
  <title>トレペタ - for Figure Skating Coaches</title>
  <meta name="theme-color" content="#0d2b45">
  <!-- PWA: ホーム画面追加時にアドレスバーなしの全画面 (Standalone) で起動するための設定 -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="トレペタ">

  <!-- Manifest & Favicon -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">

  <!-- Minimal Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('sw.js').catch(function(err) {
          console.log('SW registration failed:', err);
        });
      });
    }
  </script>

  <style>
    :root {
      --bg-app: #f4f7f6;
      --bg-card: #ffffff;
      --primary: #0d2b45;
      --primary-light: #203c56;
      --accent: #20b2aa;
      --accent-light: #e6f7f6;
      --text-main: #2b2d42;
      --text-sub: #6c757d;
      --border-color: #e2e8f0;

      /* CUD Type Colors */
      --color-personal: #2b5c8f;
      --color-group: #1d7874;
      --color-rental: #d95f02;
      --color-kyoshitsu: #7570b3;

      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --shadow-sm: 0 2px 4px rgba(0,0,0,0.04);
      --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
      --font-mono: SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0; padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-app);
      color: var(--text-main);
      overflow: hidden;
      height: 100vh; width: 100vw;
    }

    .app { display: flex; flex-direction: column; height: 100vh; max-width: 600px; margin: 0 auto; background: var(--bg-app); position: relative; }

    /* Header */
    .app-header {
      background: var(--primary); color: #fff;
      padding: 12px 16px; display: flex; align-items: center; justify-content: space-between;
      box-shadow: var(--shadow-sm); z-index: 10;
    }
    .app-header__brand { display: flex; align-items: center; gap: 8px; }
    .app-header__logo { font-size: 20px; }
    .app-header__title { font-weight: 700; font-size: 17px; letter-spacing: 0.5px; }
    .app-header__subtitle { font-size: 10px; color: rgba(255,255,255,0.7); font-weight: 400; }
    .app-header__right { display: flex; align-items: center; gap: 8px; }
    .app-header__alert { font-size: 11px; background: rgba(255,255,255,0.15); padding: 4px 8px; border-radius: 12px; color: #ffeb3b; font-weight: 600; }
    .header-gear { background: none; border: none; color: #fff; font-size: 18px; padding: 4px; cursor: pointer; }

    /* Main Scroll Area */
    .main-scroll { flex: 1; overflow-y: auto; padding: 12px 16px 80px; -webkit-overflow-scrolling: touch; }

    /* Date Strip / Month Calendar */
    .date-strip { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 12px; -webkit-overflow-scrolling: touch; scroll-behavior: smooth; }
    .date-chip {
      flex: 0 0 auto; width: 56px; padding: 8px 4px; background: var(--bg-card); border-radius: var(--radius-md);
      border: 1px solid var(--border-color); display: flex; flex-direction: column; align-items: center; gap: 2px;
      cursor: pointer; transition: all 0.2s; position: relative;
    }
    .date-chip.is-selected { background: var(--primary); color: #fff; border-color: var(--primary); transform: translateY(-2px); box-shadow: var(--shadow-sm); }
    .date-chip__weekday { font-size: 11px; font-weight: 600; color: var(--text-sub); }
    .date-chip.is-selected .date-chip__weekday { color: rgba(255,255,255,0.8); }
    .date-chip__weekday.is-sun { color: #e53e3e; }
    .date-chip__weekday.is-sat { color: #3182ce; }
    .date-chip.is-selected .date-chip__weekday.is-sun, .date-chip.is-selected .date-chip__weekday.is-sat { color: #fff; }
    .date-chip__day { font-size: 18px; font-weight: 700; }
    .date-chip__today-dot { width: 4px; height: 4px; background: var(--accent); border-radius: 50%; position: absolute; top: 4px; right: 4px; }
    .date-chip__count { font-size: 9px; margin-top: 2px; color: var(--accent); }
    .date-chip.is-selected .date-chip__count { color: #fff; }

    /* View Toggle */
    .view-toggle { display: flex; background: #e2e8f0; padding: 2px; border-radius: 8px; margin-bottom: 12px; }
    .view-toggle__btn { flex: 1; border: none; background: none; padding: 6px; font-size: 12px; font-weight: 600; border-radius: 6px; color: var(--text-sub); cursor: pointer; }
    .view-toggle__btn.is-active { background: #fff; color: var(--text-main); box-shadow: var(--shadow-sm); }

    /* Month Calendar View */
    .month-calendar { background: #fff; border-radius: var(--radius-md); padding: 12px; border: 1px solid var(--border-color); margin-bottom: 16px; }
    .month-calendar__nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .month-calendar__nav-btn { background: none; border: none; font-size: 18px; padding: 4px 12px; cursor: pointer; color: var(--text-main); }
    .month-calendar__label { font-size: 15px; font-weight: 700; }
    .month-calendar__weekdays { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; font-size: 11px; font-weight: 600; color: var(--text-sub); margin-bottom: 6px; }
    .month-calendar__weekday.is-sun { color: #e53e3e; }
    .month-calendar__weekday.is-sat { color: #3182ce; }
    .month-calendar__grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
    .month-calendar__cell {
      aspect-ratio: 1; border: none; background: none; border-radius: 6px; display: flex; flex-direction: column; align-items: center; justify-content: center;
      position: relative; cursor: pointer; font-size: 13px; font-weight: 500;
    }
    .month-calendar__cell.is-empty { cursor: default; }
    .month-calendar__cell.is-selected { background: var(--primary); color: #fff; }
    .month-calendar__cell.is-today { font-weight: 700; color: var(--accent); }
    .month-calendar__cell.is-selected.is-today { color: #fff; }
    .month-calendar__cell-dot { width: 4px; height: 4px; background: var(--accent); border-radius: 50%; position: absolute; bottom: 3px; }
    .month-calendar__cell.is-selected .month-calendar__cell-dot { background: #fff; }
    .month-calendar__cell-day.is-sun { color: #e53e3e; }
    .month-calendar__cell-day.is-sat { color: #3182ce; }
    .month-calendar__cell.is-selected .month-calendar__cell-day.is-sun,
    .month-calendar__cell.is-selected .month-calendar__cell-day.is-sat { color: #fff; }

    /* Section Heading */
    .section-heading { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 12px; }
    .section-heading__title { font-size: 16px; font-weight: 700; }
    .section-heading__meta { font-size: 12px; color: var(--text-sub); }

    /* Lesson List & Tile */
    .lesson-list { display: flex; flex-direction: column; gap: 10px; }
    .lesson-tile { background: var(--bg-card); border-radius: var(--radius-md); border: 1px solid var(--border-color); display: flex; position: relative; overflow: hidden; box-shadow: var(--shadow-sm); }
    .lesson-tile__accent { width: 6px; flex-shrink: 0; }
    .lesson-tile__accent.accent-personal { background-color: var(--color-personal); }
    .lesson-tile__accent.accent-group { background-color: var(--color-group); }
    .lesson-tile__accent.accent-rental { background-color: var(--color-rental); }
    .lesson-tile__accent.accent-kyoshitsu { background-color: var(--color-kyoshitsu); }

    .lesson-tile__main { flex: 1; padding: 12px; border: none; background: none; text-align: left; display: flex; align-items: center; gap: 10px; cursor: pointer; }
    .lesson-tile__time { display: flex; flex-direction: column; width: 48px; flex-shrink: 0; text-align: center; }
    .lesson-tile__time-start { font-size: 14px; font-weight: 700; }
    .lesson-tile__time-end { font-size: 10px; color: var(--text-sub); }

    .type-badge {
      display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 14px;
      width: 28px; height: 28px; color: #fff;
    }
    .type-badge.shape-circle { border-radius: 50%; }
    .type-badge.shape-round { border-radius: 6px; }
    .type-badge.shape-hex { clip-path: polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%); }
    .type-badge.shape-square { border-radius: 2px; }

    .type-badge.type-personal, .type-badge--personal { background-color: var(--color-personal); }
    .type-badge.type-group, .type-badge--group { background-color: var(--color-group); }
    .type-badge.type-rental, .type-badge--rental { background-color: var(--color-rental); }
    .type-badge.type-kyoshitsu, .type-badge--kyoshitsu { background-color: var(--color-kyoshitsu); }

    .lesson-tile__body { flex: 1; min-width: 0; }
    .lesson-tile__title-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-bottom: 2px; }
    .lesson-tile__student { font-weight: 700; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .lesson-tile__type-label { font-size: 10px; padding: 1px 5px; border-radius: 4px; color: #fff; font-weight: 600; }
    .lesson-tile__sub { font-size: 12px; color: var(--text-sub); margin-bottom: 4px; }
    .lesson-tile__badges { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }

    .status-pill { font-size: 10px; padding: 2px 6px; border-radius: 10px; background: #edf2f7; color: var(--text-sub); display: inline-flex; align-items: center; gap: 3px; }
    .status-pill--contact.is-on { background: #e6fffa; color: #234e52; border: 1px solid #b2f5ea; }
    .status-pill--payment.is-on { background: #f0fff4; color: #22543d; border: 1px solid #c6f6d5; }
    .status-pill__dot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
    .lesson-tile__tagcount { font-size: 10px; color: var(--text-sub); }

    /* Level Badges for CUD */
    .level-tag { font-size: 10px; padding: 1px 6px; border-radius: 4px; background: #e2e8f0; color: #4a5568; font-weight: 600; border: 1px solid #cbd5e0; display: inline-flex; align-items: center; gap: 2px; }

    .lesson-tile__actions { display: flex; align-items: center; padding-right: 8px; }
    .btn-line { background: #06c755; color: #fff; border: none; padding: 6px 10px; border-radius: 6px; font-size: 11px; font-weight: 700; display: flex; align-items: center; gap: 4px; cursor: pointer; }
    .btn-line.is-done { background: #edf2f7; color: var(--text-sub); font-weight: 500; }

    /* Empty State */
    .empty-state { text-align: center; padding: 40px 16px; background: #fff; border-radius: var(--radius-md); border: 1px border-dashed var(--border-color); }
    .empty-state__icon { font-size: 32px; margin-bottom: 8px; }
    .empty-state__text { font-size: 14px; color: var(--text-sub); margin-bottom: 12px; }
    .empty-state__btn { background: var(--primary); color: #fff; border: none; padding: 8px 16px; border-radius: 20px; font-size: 13px; font-weight: 600; cursor: pointer; }

    /* Bottom Nav & FAB */
    .bottom-nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 600px; background: #fff; border-top: 1px solid var(--border-color); display: flex; height: 60px; z-index: 100; }
    .nav-btn { flex: 1; border: none; background: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: var(--text-sub); cursor: pointer; position: relative; }
    .nav-btn.is-active { color: var(--primary); font-weight: 700; }
    .nav-btn__icon { font-size: 18px; }
    .nav-btn__label { font-size: 10px; }
    .nav-btn__indicator { position: absolute; top: 0; width: 32px; height: 3px; background: var(--primary); border-radius: 0 0 3px 3px; display: none; }
    .nav-btn.is-active .nav-btn__indicator { display: block; }

    .fab { position: fixed; bottom: 72px; right: 20px; width: 52px; height: 52px; border-radius: 50%; background: var(--accent); color: #fff; border: none; font-size: 24px; box-shadow: var(--shadow-md); display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 90; }

    /* Finance View */
    .finance-view { display: flex; flex-direction: column; gap: 16px; }
    .finance-year { display: flex; justify-content: space-between; align-items: center; background: #fff; padding: 12px 16px; border-radius: var(--radius-md); border: 1px solid var(--border-color); }
    .year-nav { display: flex; align-items: center; gap: 12px; }
    .year-nav__btn { background: none; border: none; font-size: 18px; cursor: pointer; color: var(--text-main); }
    .year-nav__label { font-size: 16px; font-weight: 700; }
    .btn-csv { background: var(--primary-light); color: #fff; border: none; padding: 6px 12px; border-radius: 6px; font-size: 12px; display: flex; align-items: center; gap: 4px; cursor: pointer; }

    .summary-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .summary-card { background: #fff; padding: 12px; border-radius: var(--radius-md); border: 1px solid var(--border-color); }
    .summary-card--paid { border-left: 4px solid #38a169; }
    .summary-card--unpaid { border-left: 4px solid #e53e3e; }
    .summary-card__label { font-size: 11px; color: var(--text-sub); }
    .summary-card__value { font-size: 18px; font-weight: 700; margin: 4px 0; }
    .summary-card__count { font-size: 10px; color: var(--text-sub); }

    .list-title { font-size: 13px; font-weight: 700; color: var(--text-sub); margin-bottom: -6px; }
    .unpaid-list { display: flex; flex-direction: column; gap: 8px; }
    .unpaid-row { background: #fff; border-radius: var(--radius-sm); border: 1px solid var(--border-color); padding: 10px 12px; display: flex; align-items: center; gap: 10px; text-align: left; width: 100%; cursor: pointer; }
    .unpaid-row__body { flex: 1; }
    .unpaid-row__name { font-size: 13px; font-weight: 700; }
    .unpaid-row__date { font-size: 11px; color: var(--text-sub); }
    .unpaid-row__right { text-align: right; }
    .unpaid-row__fee { font-size: 13px; font-weight: 700; color: #e53e3e; }
    .unpaid-row__cta { font-size: 10px; color: var(--accent); }
    .unpaid-empty { text-align: center; padding: 20px; font-size: 13px; color: var(--text-sub); background: #fff; border-radius: var(--radius-md); border: 1px solid var(--border-color); }

    .breakdown-card { background: #fff; border-radius: var(--radius-md); border: 1px solid var(--border-color); padding: 12px; display: flex; flex-direction: column; gap: 10px; }
    .breakdown-row { display: flex; align-items: center; gap: 10px; font-size: 13px; }
    .breakdown-row__icon { width: 20px; height: 20px; font-size: 11px; }
    .breakdown-row__label { flex: 1; }
    .breakdown-row__count { font-size: 11px; color: var(--text-sub); }
    .breakdown-row__sum { font-weight: 700; width: 80px; text-align: right; }

    /* Modals & Bottom Sheets */
    .sheet-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 200; display: flex; flex-direction: column; justify-content: flex-end; }
    .sheet-backdrop { position: absolute; inset: 0; }
    .sheet { position: relative; background: #fff; border-radius: 16px 16px 0 0; max-height: 90vh; display: flex; flex-direction: column; overflow: hidden; animation: slideUp 0.25s ease-out; }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    .sheet__grabber-row { display: flex; justify-content: center; padding: 8px; }
    .sheet__grabber { width: 36px; height: 4px; background: #cbd5e0; border-radius: 2px; }
    .sheet__header { padding: 8px 16px 12px; border-bottom: 1px solid var(--border-color); display: flex; align-items: center; gap: 10px; }
    .sheet__header-text { flex: 1; }
    .sheet__header-title { font-size: 16px; font-weight: 700; }
    .sheet__header-sub { font-size: 11px; color: var(--text-sub); }
    .sheet__close { background: none; border: none; font-size: 18px; color: var(--text-sub); cursor: pointer; padding: 4px; }
    .sheet__body { padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; -webkit-overflow-scrolling: touch; }
    .sheet__footer { padding: 12px 16px 20px; border-top: 1px solid var(--border-color); background: #fff; }
    .sheet__submit { width: 100%; background: var(--primary); color: #fff; border: none; padding: 12px; border-radius: 8px; font-size: 14px; font-weight: 700; cursor: pointer; }
    .sheet__submit:disabled { background: #cbd5e0; cursor: not-allowed; }

    /* Forms */
    .field-label { font-size: 11px; font-weight: 700; color: var(--text-sub); margin-bottom: 4px; display: block; }
    .text-input, .date-input, .select-input { width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: 8px; font-size: 14px; background: #fff; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }

    .type-select-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
    .type-select-btn { border: 1px solid var(--border-color); background: #fff; border-radius: 8px; padding: 8px 2px; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; }
    .type-select-btn.is-selected { border-color: var(--primary); background: #f0f4f8; }
    .type-select-btn__label { font-size: 10px; font-weight: 600; color: var(--text-sub); }

    .rink-row { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; }
    .rink-btn { flex: 0 0 auto; padding: 6px 12px; border-radius: 16px; border: 1px solid var(--border-color); background: #fff; font-size: 12px; cursor: pointer; white-space: nowrap; }
    .rink-btn.is-selected { background: var(--primary); color: #fff; border-color: var(--primary); }

    .money-box { background: #f7fafc; padding: 12px; border-radius: 8px; border: 1px solid var(--border-color); }
    .money-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
    .money-row__label { font-size: 12px; font-weight: 600; }
    .money-row__value { font-size: 16px; font-weight: 700; display: flex; align-items: center; gap: 2px; }
    .fee-input { width: 100px; text-align: right; border: 1px solid var(--border-color); border-radius: 4px; padding: 4px; font-size: 16px; font-weight: 700; }
    .stepper { display: flex; align-items: center; gap: 6px; }
    .stepper__btn { width: 28px; height: 28px; border-radius: 4px; border: 1px solid var(--border-color); background: #fff; font-weight: 700; cursor: pointer; }
    .split-input { width: 40px; text-align: center; border: 1px solid var(--border-color); border-radius: 4px; padding: 4px; font-size: 14px; }
    .per-person-note { font-size: 11px; color: var(--accent); text-align: right; font-weight: 600; margin-top: 2px; }

    .tag-wrap { display: flex; flex-wrap: wrap; gap: 6px; }
    .tag-chip { padding: 4px 10px; border-radius: 14px; border: 1px solid var(--border-color); background: #fff; font-size: 11px; cursor: pointer; }
    .tag-chip.is-selected { background: var(--accent); color: #fff; border-color: var(--accent); }

    .notes-header { display: flex; justify-content: space-between; align-items: center; }
    .mic-btn { background: #edf2f7; border: none; border-radius: 50%; width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    .mic-btn.is-recording { background: #e53e3e; color: #fff; animation: pulse 1s infinite; }
    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
    .mic-unsupported { font-size: 10px; color: var(--text-sub); }
    .recording-hint { font-size: 11px; color: #e53e3e; margin-bottom: 2px; }
    .notes-textarea { width: 100%; min-height: 90px; border: 1px solid var(--border-color); border-radius: 8px; padding: 8px; font-size: 13px; font-family: inherit; }

    .advice-box { background: #fffaf0; border: 1px solid #feebc8; border-radius: 8px; padding: 10px; }
    .advice-box__title { font-size: 11px; font-weight: 700; color: #dd6b20; display: flex; align-items: center; gap: 4px; margin-bottom: 4px; }
    .advice-box__text { font-size: 12px; color: #7b341e; }

    .action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .action-btn { padding: 8px; border-radius: 8px; border: 1px solid var(--border-color); background: #fff; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer; }
    .action-btn--line { color: #06c755; border-color: #06c755; }
    .action-btn--line.is-done { background: #e6fffa; }
    .action-btn--pay { color: #2b6cb0; border-color: #2b6cb0; }
    .action-btn--pay.is-done { background: #ebf8ff; }

    .delete-link { color: #e53e3e; background: none; border: none; font-size: 12px; text-decoration: underline; cursor: pointer; margin-top: 8px; text-align: center; }

    /* Classroom Master */
    .classroom-list { display: flex; flex-direction: column; gap: 6px; }
    .classroom-row { display: flex; align-items: center; justify-content: space-between; padding: 8px 10px; background: #f7fafc; border-radius: 6px; border: 1px solid var(--border-color); }
    .classroom-row__name { font-size: 13px; font-weight: 700; }
    .classroom-row__meta { font-size: 11px; color: var(--text-sub); }
    .classroom-row__actions { display: flex; gap: 4px; }
    .icon-btn { background: none; border: none; padding: 4px; cursor: pointer; font-size: 14px; }
    .classroom-empty { font-size: 12px; color: var(--text-sub); text-align: center; padding: 12px; }
    .classroom-form-title { font-size: 12px; font-weight: 700; color: var(--primary); display: flex; justify-content: space-between; align-items: center; }
    .classroom-cancel-edit { font-size: 11px; color: var(--text-sub); font-weight: 400; text-decoration: underline; cursor: pointer; }
    .select-wrap { margin-bottom: 4px; }
    .classroom-manage-link { background: none; border: none; color: var(--accent); font-size: 11px; font-weight: 600; padding: 0; cursor: pointer; text-decoration: underline; }

    /* Passcode Lock UI */
    .lock-screen {
      position: fixed; inset: 0; background: var(--primary); color: #fff; z-index: 999;
      display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px;
    }
    .lock-screen__title { font-size: 20px; font-weight: 700; margin-bottom: 8px; }
    .lock-screen__sub { font-size: 12px; color: rgba(255,255,255,0.7); margin-bottom: 24px; text-align: center; }
    .lock-screen__input {
      width: 180px; padding: 10px; border-radius: 8px; border: none; font-size: 20px; letter-spacing: 6px; text-align: center;
      margin-bottom: 12px; background: #fff; color: var(--text-main); font-family: var(--font-mono);
    }
    .lock-screen__btn {
      background: var(--accent); color: #fff; border: none; padding: 10px 24px; border-radius: 20px; font-size: 14px; font-weight: 700; cursor: pointer;
    }
    .lock-screen__err { color: #ff8080; font-size: 12px; height: 16px; margin-top: 8px; font-weight: 600; }
    .lock-screen.shake { animation: shake 0.3s ease-in-out; }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-10px); }
      40%, 80% { transform: translateX(10px); }
    }

    /* Toast */
    .toast-root { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); z-index: 300; pointer-events: none; width: 90%; max-width: 400px; }
    .toast { background: rgba(13, 43, 69, 0.95); color: #fff; padding: 10px 16px; border-radius: 20px; font-size: 12px; font-weight: 600; text-align: center; box-shadow: var(--shadow-md); animation: fadeIn 0.2s ease-out; }
    .toast--ok { background: rgba(32, 178, 170, 0.95); }
    .toast--danger { background: rgba(229, 62, 62, 0.95); }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }

    .mono { font-family: var(--font-mono); }
    .tappable:active { opacity: 0.7; }
    .min-tap { min-height: 36px; min-width: 36px; }
  </style>
</head>
<body>

<div class="app">
  <div id="root"></div>
</div>
<div id="overlay-root"></div>
<div id="classroom-overlay-root"></div>
<div id="lock-overlay-root"></div>
<div id="toast-root" class="toast-root"></div>

<script>
(function(){
  "use strict";
  var STORAGE_KEY = 'torepeta_lessons_v1';
  var memStore = {};

  function loadLessons(){
    try{
      var raw = window.localStorage.getItem(STORAGE_KEY);
      if(raw !== null && raw !== undefined) {
        var parsed = JSON.parse(raw);
        // マイグレーション（レベルデータの初期化）
        if(Array.isArray(parsed)) {
          parsed.forEach(function(l){
            if(!l.level) l.level = { jsf:'', isi:'', category:'' };
          });
        }
        return parsed;
      }
    }catch(e){ }
    return memStore[STORAGE_KEY] || null;
  }
  function saveLessons(lessons){
    memStore[STORAGE_KEY] = lessons;
    try{ window.localStorage.setItem(STORAGE_KEY, JSON.stringify(lessons)); }catch(e){ }
  }

  var CLASSROOM_STORAGE_KEY = 'torepeta_classrooms_v1';
  function loadClassrooms(){
    try{
      var raw = window.localStorage.getItem(CLASSROOM_STORAGE_KEY);
      if(raw !== null && raw !== undefined) return JSON.parse(raw);
    }catch(e){ }
    return memStore[CLASSROOM_STORAGE_KEY] || null;
  }
  function saveClassrooms(list){
    memStore[CLASSROOM_STORAGE_KEY] = list;
    try{ window.localStorage.setItem(CLASSROOM_STORAGE_KEY, JSON.stringify(list)); }catch(e){ }
  }

  /* パスワード（ロック）用ストレージ処理 */
  var PASSCODE_STORAGE_KEY = 'torepeta_passcode_v1';
  function loadPasscode(){
    try {
      return window.localStorage.getItem(PASSCODE_STORAGE_KEY) || '';
    } catch(e){ return ''; }
  }
  function savePasscode(code){
    try {
      if(code) window.localStorage.setItem(PASSCODE_STORAGE_KEY, code);
      else window.localStorage.removeItem(PASSCODE_STORAGE_KEY);
    } catch(e){}
  }

  var LESSON_TYPES = {
    personal:  { label:'個人レッスン', short:'個人', cls:'type-personal', shape:'shape-circle', icon:'👤' },
    group:     { label:'グループレッスン', short:'グループ', cls:'type-group', shape:'shape-round', icon:'👥' },
    rental:    { label:'貸切・振付', short:'貸切/振付', cls:'type-rental', shape:'shape-hex', icon:'⛸️' },
    kyoshitsu: { label:'教室', short:'教室', cls:'type-kyoshitsu', shape:'shape-square', icon:'🏫' }
  };
  var TYPE_ORDER = ['personal','group','rental','kyoshitsu'];
  var TAG_PRESETS = [
    '1A','2Lo','2Lz','2F','2A','3T','3S','3Lo','3Lz',
    'FSSp','CSSp','LSp','StSq','ChSq',
    '軸の意識','フリー脚','エッジ','踏切','タイミング','腕の使い方','体幹','ジャンプ矯正',
    '曲かけ','振付確認','基礎練習','試合前チェック'
  ];

  /* リンク選択肢の更新 */
  var RINKS = ['明治神宮', '東伏見', '東大和', '埼玉', '東神奈川', 'アクアリンク', '新横浜', 'その他'];

  /* レベル定義 */
  var JSF_BADGES = ['初級','1級','2級','3級','4級','5級','6級','7級','8級'];
  var ISI_LEVELS = ['Pre-Alpha','Alpha','Beta','Gamma','Delta','Freestyle 1','Freestyle 2','Freestyle 3','Freestyle 4','Freestyle 5','Freestyle 6+'];
  var CATEGORIES = ['初心者','中級','上級'];

  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
  function pad2(n){ return String(n).padStart(2,'0'); }
  function todayStr(){
    var d = new Date();
    return d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate());
  }
  function addDays(dateStr, n){
    var d = new Date(dateStr + 'T00:00:00');
    d.setDate(d.getDate() + n);
    return d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate());
  }
  function fmtDateJp(dateStr){
    var d = new Date(dateStr + 'T00:00:00');
    var w = ['日','月','火','水','木','金','土'][d.getDay()];
    return (d.getMonth()+1) + '月' + d.getDate() + '日（' + w + '）';
  }
  function yen(n){ return '¥' + Number(n||0).toLocaleString('ja-JP'); }
  function esc(str){
    return String(str==null ? '' : str).replace(/[&<>"']/g, function(ch){
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[ch];
    });
  }

  function seedData(){
    var t = todayStr();
    var tmr = addDays(t, 1);
    return [
      { id: uid(), date:t, start:'09:00', end:'09:30', type:'personal', student:'佐藤 ひなた', rink:'明治神宮', fee:4000, splitCount:1,
        contactStatus:'未連絡', paymentStatus:'未回収', tags:['3T','軸の意識'], level:{ jsf:'3級', isi:'', category:'中級' }, notes:'踏切のタイミングが早い。助走から意識づけを継続。', homework:'家で片足立ちの軸バランス練習を毎日5分。', createdAt: Date.now()-1000 },
      { id: uid(), date:t, start:'10:00', end:'10:45', type:'group', student:'ジュニアクラス（4名）', rink:'東伏見', fee:2500, splitCount:1,
        contactStatus:'連絡済', paymentStatus:'回収済', tags:['基礎練習','StSq'], level:{ jsf:'', isi:'', category:'初心者' }, notes:'', homework:'', createdAt: Date.now()-2000 },
      { id: uid(), date:t, start:'13:00', end:'14:00', type:'rental', student:'鈴木 蓮 / 高橋 陸', rink:'明治神宮', fee:9000, splitCount:2,
        contactStatus:'未連絡', paymentStatus:'未回収', tags:['曲かけ','振付確認'], level:{ jsf:'6級', isi:'', category:'上級' }, notes:'', homework:'', createdAt: Date.now()-3000 },
      { id: uid(), date:tmr, start:'16:00', end:'16:30', type:'personal', student:'佐藤 ひなた', rink:'明治神宮', fee:4000, splitCount:1,
        contactStatus:'未連絡', paymentStatus:'未回収', tags:[], level:{ jsf:'3級', isi:'', category:'中級' }, notes:'', homework:'', createdAt: Date.now() },
      { id: uid(), date:tmr, start:'18:00', end:'19:00', type:'kyoshitsu', student:'大人スケート教室', rink:'東伏見', fee:1500, splitCount:1,
        contactStatus:'未連絡', paymentStatus:'未回収', tags:[], level:{ jsf:'', isi:'', category:'' }, notes:'', homework:'', createdAt: Date.now()+1 }
    ];
  }

  function seedClassrooms(){
    return [
      { id: uid(), name:'大人スケート教室', start:'18:00', end:'19:00', rink:'東伏見' },
      { id: uid(), name:'キッズスケート教室 初級', start:'16:30', end:'17:15', rink:'明治神宮' }
    ];
  }

  var lessons = loadLessons() || seedData();
  var classroomMaster = loadClassrooms() || seedClassrooms();
  var savedPasscode = loadPasscode();
  var isUnlocked = !savedPasscode; // パスワード未設定ならロック解除状態

  var selectedDate = todayStr();
  var currentTab = 'schedule';
  var viewMode = 'day';
  var calYear = new Date().getFullYear();
  var calMonth = new Date().getMonth();
  var financeYear = new Date().getFullYear();
  var toastTimer = null;

  var rootEl = document.getElementById('root');
  var overlayRoot = document.getElementById('overlay-root');
  var classroomOverlayRoot = document.getElementById('classroom-overlay-root');
  var lockOverlayRoot = document.getElementById('lock-overlay-root');
  var toastRoot = document.getElementById('toast-root');

  function persist(){ saveLessons(lessons); }
  function persistClassrooms(){ saveClassrooms(classroomMaster); }

  function copyToClipboard(text){
    return new Promise(function(resolve){
      if(navigator.clipboard && window.isSecureContext){
        navigator.clipboard.writeText(text).then(function(){ resolve(true); }).catch(function(){ resolve(fallbackCopy(text)); });
      } else {
        resolve(fallbackCopy(text));
      }
    });
  }
  function fallbackCopy(text){
    try{
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.focus(); ta.select();
      var ok = document.execCommand('copy');
      document.body.removeChild(ta);
      return ok;
    }catch(e){ return false; }
  }

  function buildLineMessage(lesson){
    var typePhrase;
    if(lesson.type === 'kyoshitsu'){
      typePhrase = (lesson.student && lesson.student.trim()) ? lesson.student.trim() : '教室レッスン';
    } else {
      typePhrase = LESSON_TYPES[lesson.type].label;
    }
    return fmtDateJp(lesson.date) + 'は ' + lesson.start + '〜' + lesson.end + ' ' + lesson.rink + 'で ' + typePhrase + 'です。よろしくお願いいたします';
  }

  function showToast(msg, tone){
    tone = tone || 'navy';
    toastRoot.innerHTML = '<div class="toast toast--' + tone + '">' + esc(msg) + '</div>';
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toastRoot.innerHTML = ''; }, 2200);
  }

  /* ロック画面の表示 */
  function renderLockScreen(){
    if(isUnlocked) {
      lockOverlayRoot.innerHTML = '';
      return;
    }
    var html = '<div class="lock-screen" id="lock-screen-box">';
    html += '<div class="lock-screen__title">🔒 トレペタ ロック中</div>';
    html += '<div class="lock-screen__sub">パスワードを入力してください</div>';
    html += '<input type="password" id="passcode-input" class="lock-screen__input" pattern="[0-9]*" inputmode="numeric" maxlength="8" autofocus>';
    html += '<button class="lock-screen__btn tappable" id="btn-unlock">解除</button>';
    html += '<div class="lock-screen__err" id="lock-err"></div>';
    html += '</div>';
    lockOverlayRoot.innerHTML = html;

    var input = document.getElementById('passcode-input');
    var btn = document.getElementById('btn-unlock');
    var err = document.getElementById('lock-err');
    var box = document.getElementById('lock-screen-box');

    function check(){
      if(input.value === savedPasscode){
        isUnlocked = true;
        lockOverlayRoot.innerHTML = '';
        renderShell();
        showToast('ロックを解除しました', 'ok');
      } else {
        err.textContent = 'パスワードが違います';
        box.classList.remove('shake');
        void box.offsetWidth;
        box.classList.add('shake');
        input.value = '';
      }
    }
    btn.addEventListener('click', check);
    input.addEventListener('keypress', function(e){ if(e.key === 'Enter') check(); });
  }

  function renderDateStrip(){
    var html = '<div class="date-strip" id="date-strip">';
    for(var i=-2;i<14;i++){
      var key = addDays(todayStr(), i);
      var d = new Date(key + 'T00:00:00');
      var w = ['日','月','火','水','木','金','土'][d.getDay()];
      var wCls = w==='日' ? 'is-sun' : (w==='土' ? 'is-sat' : '');
      var isSel = key === selectedDate;
      var isToday = key === todayStr();
      var count = lessons.filter(function(l){ return l.date===key; }).length;
      html += '<button class="date-chip tappable min-tap' + (isSel?' is-selected':'') + '" data-action="select-date" data-date="' + key + '">';
      html += '<span class="date-chip__weekday ' + wCls + '">' + w + '</span>';
      html += '<span class="date-chip__day">' + d.getDate() + '</span>';
      if(isToday && !isSel) html += '<span class="date-chip__today-dot"></span>';
      if(count>0) html += '<span class="date-chip__count">' + (isSel ? count + '件' : '●'.repeat(Math.min(count,3))) + '</span>';
      html += '</button>';
    }
    html += '</div>';
    return html;
  }

  function renderTypeBadge(type, size){
    var t = LESSON_TYPES[type];
    return '<div class="type-badge type-badge--' + (size||'md') + ' ' + t.shape + ' ' + t.cls + '">' + t.icon + '</div>';
  }

  /* レベルバッジのタグ生成（CUD対応） */
  function renderLevelBadges(level){
    if(!level) return '';
    var html = '';
    if(level.jsf) html += '<span class="level-tag">🎖️ ' + esc(level.jsf) + '</span>';
    if(level.isi) html += '<span class="level-tag">⛸️ ' + esc(level.isi) + '</span>';
    if(level.category) html += '<span class="level-tag">🏷️ ' + esc(level.category) + '</span>';
    return html;
  }

  function renderLessonTile(l){
    var t = LESSON_TYPES[l.type];
    var contactOn = l.contactStatus === '連絡済';
    var paidOn = l.paymentStatus === '回収済';
    var html = '<div class="lesson-tile">';
    html += '<div class="lesson-tile__accent accent-' + l.type + '"></div>';
    html += '<button class="lesson-tile__main tappable" data-action="open-lesson" data-id="' + l.id + '">';
    html += '<div class="lesson-tile__time"><span class="lesson-tile__time-start mono">' + esc(l.start) + '</span><span class="lesson-tile__time-end">〜' + esc(l.end) + '</span></div>';
    html += renderTypeBadge(l.type, 'md');
    html += '<div class="lesson-tile__body">';
    html += '<div class="lesson-tile__title-row"><span class="lesson-tile__student">' + esc(l.student) + '</span><span class="lesson-tile__type-label ' + t.cls + '">' + t.short + '</span>' + renderLevelBadges(l.level) + '</div>';
    html += '<div class="lesson-tile__sub">' + esc(l.rink) + ' ・ ' + yen(l.fee) + '</div>';
    html += '<div class="lesson-tile__badges">';
    html += '<span class="status-pill status-pill--contact' + (contactOn?' is-on':'') + '"><span class="status-pill__dot"></span>' + (contactOn?'連絡済':'未連絡') + '</span>';
    html += '<span class="status-pill status-pill--payment' + (paidOn?' is-on':'') + '"><span class="status-pill__dot"></span>' + (paidOn?'回収済':'未回収') + '</span>';
    if(l.tags && l.tags.length>0) html += '<span class="lesson-tile__tagcount">🏷 ' + l.tags.length + '件</span>';
    html += '</div></div></button>';
    html += '<div class="lesson-tile__actions"><button class="btn-line tappable min-tap' + (contactOn?' is-done':'') + '" data-action="quick-line" data-id="' + l.id + '"><span>💬</span><span>' + (contactOn?'LINE文をコピー':'LINE連絡') + '</span></button></div>';
    html += '</div>';
    return html;
  }

  function renderViewToggle(){
    var html = '<div class="view-toggle">';
    html += '<button class="view-toggle__btn tappable min-tap' + (viewMode==='day'?' is-active':'') + '" data-action="set-view" data-view="day">日表示</button>';
    html += '<button class="view-toggle__btn tappable min-tap' + (viewMode==='month'?' is-active':'') + '" data-action="set-view" data-view="month">月表示</button>';
    html += '</div>';
    return html;
  }

  function renderMonthCalendar(){
    var year = calYear, month = calMonth;
    var startWeekday = new Date(year, month, 1).getDay();
    var daysInMonth = new Date(year, month+1, 0).getDate();
    var html = '<div class="month-calendar">';
    html += '<div class="month-calendar__nav"><button class="month-calendar__nav-btn tappable" data-action="cal-prev-month">‹</button><span class="month-calendar__label">' + year + '年' + (month+1) + '月</span><button class="month-calendar__nav-btn tappable" data-action="cal-next-month">›</button></div>';
    html += '<div class="month-calendar__weekdays">';
    ['日','月','火','水','木','金','土'].forEach(function(w, idx){
      var cls = idx===0 ? 'is-sun' : (idx===6 ? 'is-sat' : '');
      html += '<span class="month-calendar__weekday ' + cls + '">' + w + '</span>';
    });
    html += '</div><div class="month-calendar__grid">';
    for(var i=0;i<startWeekday;i++){ html += '<div class="month-calendar__cell is-empty"></div>'; }
    for(var day=1; day<=daysInMonth; day++){
      var dateKey = year + '-' + pad2(month+1) + '-' + pad2(day);
      var isSel = dateKey === selectedDate;
      var isToday = dateKey === todayStr();
      var count = lessons.filter(function(l){ return l.date===dateKey; }).length;
      var wd = new Date(year, month, day).getDay();
      var wdCls = wd===0 ? 'is-sun' : (wd===6 ? 'is-sat' : '');
      html += '<button class="month-calendar__cell tappable' + (isSel?' is-selected':'') + (isToday&&!isSel?' is-today':'') + '" data-action="select-date" data-date="' + dateKey + '">';
      html += '<span class="month-calendar__cell-day ' + wdCls + '">' + day + '</span>';
      if(count>0) html += '<span class="month-calendar__cell-dot"></span>';
      html += '</button>';
    }
    html += '</div></div>';
    return html;
  }

  function renderScheduleView(){
    var dayLessons = lessons.filter(function(l){ return l.date===selectedDate; }).sort(function(a,b){ return a.start.localeCompare(b.start); });
    var html = renderViewToggle();
    html += (viewMode === 'month') ? renderMonthCalendar() : renderDateStrip();
    html += '<div class="section-heading"><span class="section-heading__title">' + fmtDateJp(selectedDate) + '</span><span class="section-heading__meta">' + dayLessons.length + '件の予定</span></div>';
    if(dayLessons.length === 0){
      html += '<div class="lesson-list"><div class="empty-state"><div class="empty-state__icon">🧊</div><div class="empty-state__text">この日の予定はまだありません</div><button class="empty-state__btn tappable" data-action="open-add">＋ 予定を追加</button></div></div>';
    } else {
      html += '<div class="lesson-list">';
      dayLessons.forEach(function(l){ html += renderLessonTile(l); });
      html += '</div>';
    }
    return html;
  }

  function renderFinanceView(){
    var yearLessons = lessons.filter(function(l){ return l.date.indexOf(String(financeYear))===0; });
    var unpaid = yearLessons.filter(function(l){ return l.paymentStatus==='未回収'; });
    var paid = yearLessons.filter(function(l){ return l.paymentStatus==='回収済'; });
    var unpaidSum = unpaid.reduce(function(s,l){ return s+Number(l.fee||0); },0);
    var paidSum = paid.reduce(function(s,l){ return s+Number(l.fee||0); },0);
    var html = '<div class="finance-view">';
    html += '<div class="finance-year"><div class="year-nav">';
    html += '<button class="year-nav__btn tappable" data-action="year-prev">‹</button>';
    html += '<span class="year-nav__label mono">' + financeYear + '年</span>';
    html += '<button class="year-nav__btn tappable" data-action="year-next">›</button>';
    html += '</div><button class="btn-csv tappable" data-action="export-csv"><span>⬇️</span><span>確定申告用CSV出力</span></button></div>';
    html += '<div class="summary-grid">';
    html += '<div class="summary-card summary-card--paid"><div class="summary-card__label">回収済 合計</div><div class="summary-card__value mono">' + yen(paidSum) + '</div><div class="summary-card__count">' + paid.length + '件</div></div>';
    html += '<div class="summary-card summary-card--unpaid"><div class="summary-card__label">未回収 合計</div><div class="summary-card__value mono">' + yen(unpaidSum) + '</div><div class="summary-card__count">' + unpaid.length + '件</div></div>';
    html += '</div>';
    html += '<div class="list-title">未回収の一覧（タップで回収済みに）</div>';
    if(unpaid.length === 0){
      html += '<div class="unpaid-empty" style="margin-bottom:20px;">未回収のレッスンはありません 🎉</div>';
    } else {
      html += '<div class="unpaid-list">';
      unpaid.sort(function(a,b){ return a.date.localeCompare(b.date); }).forEach(function(l){
        html += '<button class="unpaid-row tappable" data-action="toggle-payment" data-id="' + l.id + '">';
        html += renderTypeBadge(l.type,'sm');
        html += '<div class="unpaid-row__body"><div class="unpaid-row__name">' + esc(l.student) + '</div><div class="unpaid-row__date mono">' + esc(l.date) + ' ' + esc(l.start) + '</div></div>';
        html += '<div class="unpaid-row__right"><div class="unpaid-row__fee mono">' + yen(l.fee) + '</div><div class="unpaid-row__cta">タップで回収済へ →</div></div>';
        html += '</button>';
      });

  function exportCsv(){
    var rows = lessons.filter(function(l){ return l.date.indexOf(String(financeYear))===0; });
    if(rows.length === 0){ showToast(financeYear + '年のデータがありません', 'danger'); return; }
    var header = ['日付','開始','終了','種別','生徒名/グループ名','バッジテスト','ISI','区分','リンク','料金','割り勘人数','入金状況','連絡状況','カルテタグ'];
    rows = rows.slice().sort(function(a,b){ return a.date.localeCompare(b.date) || a.start.localeCompare(b.start); });
    var lines = rows.map(function(l){
      var lvl = l.level || {};
      return [ l.date, l.start, l.end, LESSON_TYPES[l.type].label, l.student, lvl.jsf||'', lvl.isi||'', lvl.category||'', l.rink, l.fee, l.splitCount||1, l.paymentStatus, l.contactStatus, (l.tags||[]).join('/') ];
    });
    var totalAll = rows.reduce(function(s,l){ return s+Number(l.fee||0); },0);
    var totalPaid = rows.filter(function(l){ return l.paymentStatus==='回収済'; }).reduce(function(s,l){ return s+Number(l.fee||0); },0);
    lines.push([]);
    lines.push(['', '', '', '', '', '', '', '', '年間合計', totalAll, '', '回収済合計:' + totalPaid, '', '']);
    function escCsv(v){
      var s = String(v==null ? '' : v);
      return /[",\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s;
    }
    var csv = [header].concat(lines).map(function(row){ return row.map(escCsv).join(','); }).join('\r\n');
    var blob = new Blob(['\uFEFF' + csv], { type:'text/csv;charset=utf-8;' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'トレペタ_確定申告用_' + financeYear + '年.csv';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast(financeYear + '年分のCSVを出力しました', 'ok');
  }

  function createRecognizer(onFinalText){
    var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if(!SR) return null;
    var rec = new SR();
    rec.lang = 'ja-JP';
    rec.continuous = true;
    rec.interimResults = true;
    rec.onresult = function(e){
      var finalTxt = '';
      for(var i=e.resultIndex; i<e.results.length; i++){
        if(e.results[i].isFinal) finalTxt += e.results[i][0].transcript;
      }
      if(finalTxt) onFinalText(finalTxt);
    };
    return rec;
  }

    });
    candidates.sort(function(a,b){ return (b.date+'T'+b.start).localeCompare(a.date+'T'+a.start); });
    return candidates[0] || null;
  }

  function attachLessonModalListeners(lesson){
    var overlay = document.getElementById('lesson-overlay');
    overlay.addEventListener('click', function(e){
      var actionEl = e.target.closest('[data-action]');
      if(actionEl && actionEl.dataset.action === 'close-sheet' && (actionEl === e.target || actionEl.classList.contains('sheet-backdrop'))){
        closeModal();
      }
    });
    var feeInput = document.getElementById('fee-input');
    var splitInput = document.getElementById('split-input');
    var perPersonNote = document.getElementById('per-person-note');
    function recalcPerPerson(){
      if(!splitInput) return;
      var fee = Number(feeInput.value) || 0;
      var split = Math.max(1, Number(splitInput.value) || 1);
      if(split > 1){
        perPersonNote.style.display = '';
        perPersonNote.textContent = 'お一人あたり ' + yen(Math.ceil(fee/split));
      } else {
        perPersonNote.style.display = 'none';
      }
    }
    if(feeInput) feeInput.addEventListener('input', recalcPerPerson);
    if(splitInput){
      splitInput.addEventListener('input', recalcPerPerson);
      document.getElementById('split-minus').addEventListener('click', function(){
        splitInput.value = Math.max(1, (Number(splitInput.value)||1) - 1);
        recalcPerPerson();
      });
      document.getElementById('split-plus').addEventListener('click', function(){
        splitInput.value = (Number(splitInput.value)||1) + 1;
        recalcPerPerson();
      });
    }
    var tagWrap = document.getElementById('tag-wrap');
    tagWrap.addEventListener('click', function(e){
      var chip = e.target.closest('.tag-chip');
      if(!chip) return;
      chip.classList.toggle('is-selected');
    });
    function currentTags(){
      return Array.prototype.slice.call(tagWrap.querySelectorAll('.tag-chip.is-selected')).map(function(el){ return el.dataset.tag; });
    }
    function currentFee(){ return Number(feeInput.value) || 0; }
    function currentSplit(){ return splitInput ? Math.max(1, Number(splitInput.value)||1) : 1; }

    document.getElementById('btn-line').addEventListener('click', function(){
      lesson.fee = currentFee();
      lesson.splitCount = currentSplit();
      var msg = buildLineMessage(lesson);
      copyToClipboard(msg).then(function(ok){
        if(ok){
          lesson.contactStatus = '連絡済';
          persist();
          renderShell();
          var btn = document.getElementById('btn-line');
          btn.classList.add('is-done');
          btn.innerHTML = '<span class="action-btn__icon">💬</span><span>連絡済（再コピー）</span>';
          showToast('LINE文をコピーしました📋', 'ok');
        } else {
          showToast('コピーに失敗しました', 'danger');
        }
      });
    });

    document.getElementById('btn-pay').addEventListener('click', function(){
      lesson.paymentStatus = lesson.paymentStatus === '回収済' ? '未回収' : '回収済';
      persist();
      renderShell();
      var btn = document.getElementById('btn-pay');
      var isDone = lesson.paymentStatus === '回収済';
      btn.classList.toggle('is-done', isDone);
      btn.innerHTML = '<span class="action-btn__icon">' + (isDone?'✅':'💴') + '</span><span>' + (isDone?'回収済み':'未回収 → タップで回収') + '</span>';
      showToast(isDone ? '入金済みにしました' : '未回収に戻しました', 'navy');
    });

    var micBtn = document.getElementById('mic-btn');
    var recordingHint = document.getElementById('recording-hint');
    var notesTextarea = document.getElementById('notes-textarea');
    var recognizing = false;
    var recognizer = createRecognizer(function(text){
      notesTextarea.value = (notesTextarea.value ? notesTextarea.value + ' ' : '') + text;
    });

    if(!recognizer){
      micBtn.outerHTML = '<span class="mic-unsupported">🎤 音声入力非対応</span>';
    } else {
      recognizer.onend = function(){ recognizing = false; micBtn.classList.remove('is-recording'); recordingHint.style.display = 'none'; };
      recognizer.onerror = function(){ recognizing = false; micBtn.classList.remove('is-recording'); recordingHint.style.display = 'none'; };
      micBtn.addEventListener('click', function(){
        if(recognizing){
          recognizer.stop();
          recognizing = false;
          micBtn.classList.remove('is-recording');
          recordingHint.style.display = 'none';
        } else {
          try{
            recognizer.start();
            recognizing = true;
            micBtn.classList.add('is-recording');
            recordingHint.style.display = '';
          }catch(e){ }
        }
      });
    }

    document.getElementById('btn-delete').addEventListener('click', function(){
      if(window.confirm('この予定を削除しますか？')){
        lessons = lessons.filter(function(l){ return l.id !== lesson.id; });
        persist();
        closeModal();
        renderShell();
        showToast('予定を削除しました', 'navy');
      }
    });

    document.getElementById('btn-save-lesson').addEventListener('click', function(){
      lesson.fee = currentFee();
      lesson.splitCount = currentSplit();
      lesson.tags = currentTags();
      lesson.notes = notesTextarea.value;
      lesson.homework = document.getElementById('homework-textarea').value;
      lesson.level = {
        jsf: document.getElementById('edit-lvl-jsf').value,
        isi: document.getElementById('edit-lvl-isi').value,
        category: document.getElementById('edit-lvl-cat').value
      };
      persist();
      renderShell();
      closeModal();
      showToast('カルテを保存しました', 'ok');
    });
  }

    html += '<div class="money-box">';
    html += '<div class="money-row"><span class="money-row__label">料金</span><span class="money-row__value"><span class="mono">¥</span><input type="number" id="add-fee" class="fee-input mono" value="4000"></span></div>';
    html += '<div class="money-row" id="add-split-row" style="display:none;"><span class="money-row__label">割り勘人数</span><div class="stepper"><button class="stepper__btn tappable" id="add-split-minus">−</button><input type="number" id="add-split" class="split-input mono" min="1" value="1"><button class="stepper__btn tappable" id="add-split-plus">＋</button></div></div>';
    html += '</div>';
    html += '</div>';
    html += '<div class="sheet__footer"><button class="sheet__submit tappable" id="btn-create-lesson" disabled>この内容で追加する</button></div>';
    html += '</div></div>';
    overlayRoot.innerHTML = html;
    attachAddSheetListeners();
  }

  function attachAddSheetListeners(){
    var overlay = document.getElementById('add-overlay');
    var selectedType = 'personal';
    overlay.addEventListener('click', function(e){
      var actionEl = e.target.closest('[data-action]');
      if(!actionEl) return;
      if(actionEl.dataset.action === 'close-sheet'){ closeModal(); }
      else if(actionEl.dataset.action === 'open-classroom-master'){ openClassroomMasterModal(); }
    });
    var typeGrid = document.getElementById('type-select-grid');
    var splitRow = document.getElementById('add-split-row');
    var classroomBlock = document.getElementById('classroom-select-block');
    var studentLabel = document.getElementById('add-student-label');
    var studentInputEl = document.getElementById('add-student');
    var allSelCls = TYPE_ORDER.map(function(k){ return 'sel-' + k; });

    typeGrid.addEventListener('click', function(e){
      var btn = e.target.closest('.type-select-btn');
      if(!btn) return;
      Array.prototype.forEach.call(typeGrid.querySelectorAll('.type-select-btn'), function(el){
        el.classList.remove.apply(el.classList, ['is-selected'].concat(allSelCls));
      });
      btn.classList.add('is-selected', btn.dataset.selcls);
      selectedType = btn.dataset.type;
      splitRow.style.display = (selectedType === 'rental') ? '' : 'none';
      if(selectedType === 'kyoshitsu'){
        classroomBlock.style.display = '';
        studentLabel.textContent = '教室名 / レッスン内容';
        studentInputEl.placeholder = '例：〇〇スケート教室 / 大人クラス初級';
      } else {
        classroomBlock.style.display = 'none';
        studentLabel.textContent = '生徒名 / グループ名';
        studentInputEl.placeholder = '例：佐藤 ひなた';
      }
    });

    var rinkRow = document.getElementById('rink-row');
    rinkRow.addEventListener('click', function(e){
      var btn = e.target.closest('.rink-btn');
      if(!btn) return;
      Array.prototype.forEach.call(rinkRow.querySelectorAll('.rink-btn'), function(el){ el.classList.remove('is-selected'); });
      btn.classList.add('is-selected');
    });

    var classroomSelect = document.getElementById('add-classroom-select');
    classroomSelect.addEventListener('change', function(){
      var val = classroomSelect.value;
      if(!val) return;
      var c = classroomMaster.find(function(x){ return x.id === val; });
      if(!c) return;
      studentInputEl.value = c.name;
      document.getElementById('add-start').value = c.start;
      document.getElementById('add-end').value = c.end;
      Array.prototype.forEach.call(rinkRow.querySelectorAll('.rink-btn'), function(el){
        el.classList.toggle('is-selected', el.dataset.rink === c.rink);
      });
      submitBtnRef.disabled = studentInputEl.value.trim().length === 0;
    });

    var addSplit = document.getElementById('add-split');
    document.getElementById('add-split-minus').addEventListener('click', function(){ addSplit.value = Math.max(1,(Number(addSplit.value)||1)-1); });
    document.getElementById('add-split-plus').addEventListener('click', function(){ addSplit.value = (Number(addSplit.value)||1)+1; });

    var studentInput = document.getElementById('add-student');
    var submitBtnRef = document.getElementById('btn-create-lesson');
    var submitBtn = submitBtnRef;
    studentInput.addEventListener('input', function(){ submitBtn.disabled = studentInput.value.trim().length === 0; });

    submitBtn.addEventListener('click', function(){
      if(studentInput.value.trim().length === 0) return;
      var rinkBtn = rinkRow.querySelector('.rink-btn.is-selected');
      var newLesson = {
        id: uid(),
        date: document.getElementById('add-date').value || todayStr(),
        start: document.getElementById('add-start').value || '09:00',
        end: document.getElementById('add-end').value || '09:30',
        type: selectedType,
        student: studentInput.value.trim(),
        rink: rinkBtn ? rinkBtn.dataset.rink : RINKS[0],
        fee: Number(document.getElementById('add-fee').value) || 0,
        splitCount: Math.max(1, Number(addSplit.value)||1),
        contactStatus: '未連絡',
        paymentStatus: '未回収',
        tags: [],
        level: {
          jsf: document.getElementById('add-lvl-jsf').value,
          isi: document.getElementById('add-lvl-isi').value,
          category: document.getElementById('add-lvl-cat').value
        },
        notes: '',
        homework: '',
        createdAt: Date.now()
      };
      lessons.push(newLesson);
      persist();
      selectedDate = newLesson.date;
      closeModal();
      renderShell();
      showToast('予定を追加しました', 'ok');
    });
  }

  function buildClassroomOptions(){
    var opts = '<option value="">— 選択してください —</option>';
    classroomMaster.forEach(function(c){
      opts += '<option value="' + c.id + '">' + esc(c.name) + '（' + esc(c.start) + '〜' + esc(c.end) + ' ' + esc(c.rink) + '）</option>';
    });
    return opts;
  }

  function refreshClassroomSelect(){
    var sel = document.getElementById('add-classroom-select');
    if(!sel) return;
    var current = sel.value;
    sel.innerHTML = buildClassroomOptions();
    if(classroomMaster.some(function(c){ return c.id === current; })) sel.value = current;
  }

  function openClassroomMasterModal(){ renderClassroomMasterModal(null); }
  function closeClassroomMasterModal(){
    classroomOverlayRoot.innerHTML = '';
    refreshClassroomSelect();
  }

  function renderClassroomMasterModal(editId){
    var editing = editId ? classroomMaster.find(function(c){ return c.id === editId; }) : null;
    var html = '<div class="sheet-overlay" id="classroom-master-overlay">';
    html += '<div class="sheet-backdrop" data-action="close-classroom-master"></div>';
    html += '<div class="sheet">';
    html += '<div class="sheet__grabber-row"><div class="sheet__grabber"></div></div>';
    html += '<div class="sheet__header"><div class="sheet__header-text"><div class="sheet__header-title">教室マスタを管理</div><div class="sheet__header-sub">名称・時間・場所を登録しておくと予定作成が早くなります</div></div><button class="sheet__close tappable" data-action="close-classroom-master">✕</button></div>';
    html += '<div class="sheet__body">';
    html += '<div><div class="field-label">登録済みの教室</div>';
    if(classroomMaster.length === 0){
      html += '<div class="classroom-empty">まだ登録がありません</div>';
    } else {
      html += '<div class="classroom-list">';
      classroomMaster.forEach(function(c){
        html += '<div class="classroom-row">';
        html += '<div class="classroom-row__body"><div class="classroom-row__name">' + esc(c.name) + '</div><div class="classroom-row__meta mono">' + esc(c.start) + '〜' + esc(c.end) + ' ・ ' + esc(c.rink) + '</div></div>';
        html += '<div class="classroom-row__actions">';
        html += '<button class="icon-btn tappable" data-action="edit-classroom-row" data-id="' + c.id + '">✏️</button>';
        html += '<button class="icon-btn icon-btn--danger tappable" data-action="delete-classroom-row" data-id="' + c.id + '">🗑</button>';
        html += '</div></div>';
      });
      html += '</div>';
    }
    html += '</div>';
    html += '<div>';
    html += '<div class="classroom-form-title">' + (editing ? '教室を編集' : '新しい教室を登録') + (editing ? '<span class="classroom-cancel-edit tappable" data-action="cancel-edit-classroom">キャンセル</span>' : '') + '</div>';
    html += '<div style="margin-top:10px;"><div class="field-label">教室名</div><input type="text" id="cm-name" class="text-input" placeholder="例：大人スケート教室" value="' + (editing ? esc(editing.name) : '') + '"></div>';
    html += '<div class="grid-2" style="margin-top:12px;">';
    html += '<div><div class="field-label">開始</div><input type="time" id="cm-start" class="date-input" value="' + (editing ? esc(editing.start) : '18:00') + '"></div>';
    html += '<div><div class="field-label">終了</div><input type="time" id="cm-end" class="date-input" value="' + (editing ? esc(editing.end) : '19:00') + '"></div>';
    html += '</div>';
    html += '<div style="margin-top:12px;"><div class="field-label">リンク</div><div class="rink-row" id="cm-rink-row">';
    RINKS.forEach(function(r, idx){
      var isSel = editing ? (editing.rink === r) : (idx === 0);
      html += '<button class="rink-btn tappable min-tap' + (isSel?' is-selected':'') + '" data-rink="' + esc(r) + '">' + esc(r) + '</button>';
    });
    html += '</div></div>';
    html += '</div>';
    html += '</div>';
    html += '<div class="sheet__footer"><button class="sheet__submit tappable" id="btn-save-classroom">' + (editing ? 'この内容で更新する' : 'この内容で登録する') + '</button></div>';
    html += '</div></div>';
    classroomOverlayRoot.innerHTML = html;
    attachClassroomMasterListeners(editId);
  }

  function attachClassroomMasterListeners(editId){
    var overlay = document.getElementById('classroom-master-overlay');
    overlay.addEventListener('click', function(e){
      var actionEl = e.target.closest('[data-action]');
      if(!actionEl) return;
      var action = actionEl.dataset.action;
      if(action === 'close-classroom-master'){
        closeClassroomMasterModal();
      } else if(action === 'edit-classroom-row'){
        renderClassroomMasterModal(actionEl.dataset.id);
      } else if(action === 'cancel-edit-classroom'){
        renderClassroomMasterModal(null);
      } else if(action === 'delete-classroom-row'){
        if(window.confirm('この教室をマスタから削除しますか？（過去の予定データは残ります）')){
          classroomMaster = classroomMaster.filter(function(c){ return c.id !== actionEl.dataset.id; });
          persistClassrooms();
          renderClassroomMasterModal(null);
          refreshClassroomSelect();
          showToast('教室を削除しました', 'navy');
        }
      }
    });

    var cmRinkRow = document.getElementById('cm-rink-row');
    cmRinkRow.addEventListener('click', function(e){
      var btn = e.target.closest('.rink-btn');
      if(!btn) return;
      Array.prototype.forEach.call(cmRinkRow.querySelectorAll('.rink-btn'), function(el){ el.classList.remove('is-selected'); });
      btn.classList.add('is-selected');
    });

    document.getElementById('btn-save-classroom').addEventListener('click', function(){
      var nameInput = document.getElementById('cm-name');
      var name = nameInput.value.trim();
      if(!name){ showToast('教室名を入力してください', 'danger'); return; }
      var start = document.getElementById('cm-start').value || '18:00';
      var end = document.getElementById('cm-end').value || '19:00';
      var rinkBtn = cmRinkRow.querySelector('.rink-btn.is-selected');
      var rink = rinkBtn ? rinkBtn.dataset.rink : RINKS[0];

      if(editId){
        var target = classroomMaster.find(function(c){ return c.id === editId; });
        if(target){ target.name = name; target.start = start; target.end = end; target.rink = rink; }
      } else {
        classroomMaster.push({ id: uid(), name: name, start: start, end: end, rink: rink });
      }
      persistClassrooms();
      refreshClassroomSelect();
      renderClassroomMasterModal(null);
      showToast(editId ? '教室を更新しました' : '教室を登録しました', 'ok');
    });
  }

  /* パスワード（ロック）設定モーダル */
  function openPasscodeSettingsModal(){
    var html = '<div class="sheet-overlay" id="passcode-modal-overlay">';
    html += '<div class="sheet-backdrop" data-action="close-passcode-modal"></div>';
    html += '<div class="sheet">';
    html += '<div class="sheet__grabber-row"><div class="sheet__grabber"></div></div>';
    html += '<div class="sheet__header"><div class="sheet__header-text"><div class="sheet__header-title">🔒 アプリのパスワード設定</div></div><button class="sheet__close tappable" data-action="close-passcode-modal">✕</button></div>';
    html += '<div class="sheet__body">';
    html += '<div style="font-size:12px; color:var(--text-sub);">アプリ起動時または復帰時にパスワードを要求するように設定します。</div>';
    html += '<div><div class="field-label">新しいパスワード（数字4〜8桁）</div><input type="password" id="setting-pass-1" class="text-input mono" pattern="[0-9]*" inputmode="numeric" placeholder="未設定にする場合は空欄"></div>';
    html += '<div><div class="field-label">パスワード再入力</div><input type="password" id="setting-pass-2" class="text-input mono" pattern="[0-9]*" inputmode="numeric" placeholder="確認のためもう一度入力"></div>';
    if(savedPasscode) {
      html += '<button class="delete-link tappable" id="btn-remove-passcode">パスワード保護を解除（未設定にする）</button>';
    }
    html += '</div>';
    html += '<div class="sheet__footer"><button class="sheet__submit tappable" id="btn-save-passcode">保存する</button></div>';
    html += '</div></div>';
    classroomOverlayRoot.innerHTML = html;

    var overlay = document.getElementById('passcode-modal-overlay');
    overlay.addEventListener('click', function(e){
      var actionEl = e.target.closest('[data-action]');
      if(actionEl && actionEl.dataset.action === 'close-passcode-modal') classroomOverlayRoot.innerHTML = '';
    });

    document.getElementById('btn-save-passcode').addEventListener('click', function(){
      var p1 = document.getElementById('setting-pass-1').value.trim();
      var p2 = document.getElementById('setting-pass-2').value.trim();
      if(p1 !== p2){
        showToast('パスワードが一致しません', 'danger');
        return;
      }
      savedPasscode = p1;
      savePasscode(p1);
      classroomOverlayRoot.innerHTML = '';
      showToast(p1 ? 'パスワードを設定しました' : 'パスワードを解除しました', 'ok');
    });

    var btnRemove = document.getElementById('btn-remove-passcode');
    if(btnRemove){
      btnRemove.addEventListener('click', function(){
        savedPasscode = '';
        savePasscode('');
        classroomOverlayRoot.innerHTML = '';
        showToast('パスワード保護を解除しました', 'navy');
      });
    }
  }

  rootEl.addEventListener('click', function(e){
    var el = e.target.closest('[data-action]');
    if(!el) return;
    var action = el.dataset.action;
    if(action === 'select-date') selectDate(el.dataset.date);
    else if(action === 'switch-tab') switchTab(el.dataset.tab);
    else if(action === 'open-lesson') openLessonModal(el.dataset.id);
    else if(action === 'quick-line') quickLine(el.dataset.id);
    else if(action === 'toggle-payment') togglePaymentFromFinance(el.dataset.id);
    else if(action === 'open-add') openAddSheet();
    else if(action === 'export-csv') exportCsv();
    else if(action === 'year-prev') changeFinanceYear(-1);
    else if(action === 'year-next') changeFinanceYear(1);
    else if(action === 'set-view') setViewMode(el.dataset.view);
    else if(action === 'cal-prev-month') calPrevMonth();
    else if(action === 'cal-next-month') calNextMonth();
    else if(action === 'open-classroom-master') openClassroomMasterModal();
    else if(action === 'open-passcode-settings') openPasscodeSettingsModal();
  });

  renderShell();
})();
</script>
</body>
</html>
